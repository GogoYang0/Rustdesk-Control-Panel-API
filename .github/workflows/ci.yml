name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.27.x"
          go-package: ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: go test
        run: go test -race ./...

  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: panel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: panel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: "host=localhost user=postgres password=postgres dbname=panel_test port=5432 sslmode=disable"
      TEST_MYSQL_DSN: "root:mysql@tcp(localhost:3306)/panel_test?parseTime=true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: wait for databases
        run: sleep 10
      - name: go test (postgres + mysql)
        run: go test ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.x"
      - name: spectral lint
        run: npx -y @stoplight/spectral-cli lint openapi.yaml
      - name: generate code from contract
        run: go generate ./...
      - name: fail on drift
        run: git diff --exit-code -- gen openapi.yaml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: go build
        run: go build ./...
