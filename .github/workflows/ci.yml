name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.27.x"
          go-package: ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: go test
        run: go test -race ./...

  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: panel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: panel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      openldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: "Panel Test"
          LDAP_DOMAIN: "example.org"
          LDAP_ADMIN_PASSWORD: "adminpassword"
        # The image listens on 389/636 inside the container; the host side is
        # mapped to 1389 so the tests (fixed port 1389) never collide with a
        # local slapd.
        ports:
          - 1389:389
        options: >-
          --health-cmd "ldapwhoami -H ldap://localhost:389 -x"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: "host=localhost user=postgres password=postgres dbname=panel_test port=5432 sslmode=disable"
      TEST_MYSQL_DSN: "root:mysql@tcp(localhost:3306)/panel_test?parseTime=true"
      PANEL_LDAP_TEST_HOST: "localhost"
      PANEL_LDAP_TEST_BASEDN: "dc=example,dc=org"
      PANEL_LDAP_TEST_BINDDN: "cn=admin,dc=example,dc=org"
      PANEL_LDAP_BIND_PASSWORD: "adminpassword"
      # The directory is seeded by the "seed the ldap directory" step below:
      # osixia/openldap has no env-based LDIF seeding, so the entries the
      # env-gated tests expect are added with ldapadd after startup.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: wait for databases
        run: sleep 10
      - name: seed the ldap directory
        run: |
          CID=$(docker ps -q --filter ancestor=osixia/openldap:1.5.0 | head -1)
          test -n "$CID" || { echo "openldap service container not found"; exit 1; }
          docker exec -i "$CID" ldapadd -x -H ldap://localhost:389 \
            -D "cn=admin,dc=example,dc=org" -w adminpassword <<'LDIF'
          dn: ou=people,dc=example,dc=org
          objectClass: organizationalUnit
          ou: people

          dn: uid=alice,ou=people,dc=example,dc=org
          objectClass: inetOrgPerson
          cn: Alice Test
          sn: Test
          uid: alice
          userPassword: alicepassword
          mail: ldap-alice@example.com

          dn: uid=nomail,ou=people,dc=example,dc=org
          objectClass: inetOrgPerson
          cn: No Mail
          sn: Test
          uid: nomail
          userPassword: nomailpassword
          LDIF
      - name: go test (postgres)
        # Every package shares one Postgres instance and Go runs package test
        # binaries in parallel (-p = GOMAXPROCS). Concurrent AutoMigrate of the
        # same tables then races in the pg system catalogs (pg_type / pg_class)
        # and surfaces as a bogus TestOpen_Postgres failure (#60). Serializing
        # packages removes that concurrency without weakening an assertion.
        #
        # The two runs are separate on purpose: the harnesses prefer
        # TEST_POSTGRES_DSN over TEST_MYSQL_DSN, so a single run with both set
        # would exercise Postgres twice and never MySQL. Each step blanks the
        # other DSN.
        run: TEST_MYSQL_DSN= go test -p 1 ./...
      - name: go test (mysql)
        run: TEST_POSTGRES_DSN= go test -p 1 ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.x"
      - name: spectral lint
        run: npx -y @stoplight/spectral-cli lint openapi.yaml
      - name: generate code from contract
        run: go generate ./...
      - name: fail on drift
        run: git diff --exit-code -- gen openapi.yaml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: go build
        run: |
          go build ./...
          # The production entrypoint must exist and compile: a bare "server"
          # ignore rule once swallowed cmd/server and CI still stayed green.
          go build -o /dev/null ./cmd/server
