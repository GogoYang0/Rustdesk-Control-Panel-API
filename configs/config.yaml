server:
  addr: ":8080"

auth:
  # Injected from PANEL_AUTH_SECRET. Never commit a real signing key: this file
  # is published, so anyone could forge access tokens with it.
  secret: ""
  accessTTL: 15m
  refreshTTL: 168h

provision:
  portStart: 21116
  portEnd: 22115
  orgLabel: "com.rustdesk-panel.org"
  roleLabel: "com.rustdesk-panel.role"
  # Must be an address clients can reach; there is no loopback fallback.
  relayHost: "panel.example.com"
  # Pin the image tag so deployments are reproducible.
  image: "rustdesk/rustdesk-server:1.1.11"
  dataDir: "./data/servergroups"
  maxOrgsPerUser: 5
  workers: 2

database:
  driver: sqlite
  dsn: "file:data/panel.db"

log:
  level: info
  format: json

mail:
  # devMode prints outgoing messages to stdout instead of delivering them;
  # set false and fill the smtp section for real delivery.
  devMode: true
  smtp:
    host: ""
    port: 587
    username: ""
    # The SMTP password must NOT be stored here: it is injected via the
    # PANEL_SMTP_PASSWORD environment variable (same policy as the JWT key).
    from: ""

web:
  # Frontend origin used to build the links inside outgoing emails
  # (verify-email, invitation accept). Override with PANEL_WEB_BASE_URL.
  baseURL: "http://localhost:5173"

# hbbs/hbbr log collection.
#
# The collector follows `docker logs -f -t <container>` and merges the
# container's stdout AND stderr (the RustDesk server logs to stderr by
# default). On the first connection it follows only new lines (--tail 0):
# history is not backfilled, so enabling the collector does not replay the
# existing log into duplicate rows. A reconnect resumes from the last
# observed timestamp.
#
# Rules are evaluated in order, the first match wins. Named capture groups
# become the event detail; the special group "device" carries the RustDesk id
# and links the event (plus an auxiliary heartbeat) to the device. Unmatched
# lines are counted and dropped; the panel warns once a minute when that
# happens, so a wrong rule set cannot stay silent.
#
# The defaults below follow flexi_logger's opt_format, which the pinned
# rustdesk-server image installs with `.log_to_stdout().format(opt_format)`:
#   [2026-10-20 06:00:00.640870 +00:00] INFO [src/rendezvous_mediator.rs:100] connection from 123456789
# Note the level sits *outside* the first bracket and sits ahead of a second
# bracket holding the source location; the timestamp itself contains spaces.
# Verify against `docker logs -t panel-org-<id>-hbbs` before enabling.
# Collected events are kept for 30 days: pruned on start and every
# retentionSweepInterval (see below), independently of logcollect.enabled.
logcollect:
  enabled: false
  containerPrefix: "panel-org"
  rules:
    - name: file-transfer
      pattern: '^\[[^\]]+\]\s+INFO\s+\[[^\]]+\]\s+.*(?:file|transfer).*?(?P<device>\d{6,12})'
      level: info
      kind: file
    - name: connection
      pattern: '^\[[^\]]+\]\s+INFO\s+\[[^\]]+\]\s+.*?(?P<device>\d{6,12})'
      level: info
      kind: conn
    # There is deliberately NO default `disconnected` rule: the pinned
    # rustdesk-server prints nothing about a peer's connection ending at the
    # default log level (its only close line, "Tcp connection from {:?}
    # closed", is log::debug! and carries a socket address but no device id —
    # rustdesk-server src/rendezvous_server.rs). Sessions that never see an
    # end event are closed by the idle sweep instead. If your log source does
    # emit an identifiable end line (a patched server, or debug level), add a
    # `disconnected` rule ABOVE the connection rule — rules are first-match —
    # or the broad connection pattern will absorb those lines as `conn`.
    - name: warnings
      pattern: '^\[[^\]]+\]\s+WARN\s+\[[^\]]+\]\s+(?P<msg>.*)$'
      level: warn
      kind: other
    - name: errors
      pattern: '^\[[^\]]+\]\s+ERROR\s+\[[^\]]+\]\s+(?P<msg>.*)$'
      level: error
      kind: error
  # Period of the log-event retention sweep (30-day window), minimum 1m.
  # 0 disables retention cleanup entirely (no periodic sweep, no startup
  # sweep). With a non-zero value the sweep runs on start and every interval,
  # independently of logcollect.enabled.
  retentionSweepInterval: 6h

# Session governance sweeps. The idle timeout is how long an open session may
# go without activity (or from its start, when no activity was ever recorded)
# before the background idle sweep closes it — sessions whose logs stop
# arriving are closed here. Contract: "默认 10 分钟、可由部署配置覆盖".
session:
  # Must be positive: a non-positive value is not "disable the sweep" —
  # it logs a warning and falls back to the 10m default.
  idleTimeout: 10m

# Audit-log retention archiving. Each organization may set
# audit_retention_days (0 = keep forever, up to 3650); the hourly sweep
# writes expired rows to a verified JSONL archive here BEFORE deleting them.
# Keep this directory on storage included in operator backups.
audit:
  archiveDir: ./data/audit-archive

# Interactive captcha in front of the management login, /auth/2fa/verify and
# /invitations/accept. Off by default. Providers:
#   altcha   - self-hosted proof-of-work (no external service)
#   geetest  - GeeTest v4 (server-side secondary validation)
#   cap      - self-hosted Cap Standalone (/siteverify)
# Provider secrets are injected from the environment and must never be stored
# here: PANEL_CAPTCHA_ALTCHA_KEY, PANEL_CAPTCHA_GEETEST_KEY,
# PANEL_CAPTCHA_CAP_SECRET.
captcha:
  enabled: false
  provider: "altcha"
  # closed: a provider outage blocks the three entrances (503).
  # open:   a provider outage lets the request through (logged as an error).
  failMode: "closed"
  challengeTTL: 5m
  altcha:
    # Proof-of-work difficulty; higher costs the client more CPU.
    maxNumber: 100000
  geetest:
    captchaId: ""
  cap:
    instanceUrl: ""
    siteKey: ""

# Custom client generator. Disabled by default; profile CRUD remains available
# for preparation, but build creation returns 503 until enabled.
#
# publicBaseURL must be the panel origin reachable by the build runner; it is
# also compiled into the client as its API server (compat entry).
# publicBaseURL and github.apiBaseURL must be https: the bundle token and the
# PAT travel over them. http is accepted only for localhost/127.0.0.1/::1.
# Secrets are injected from the environment and must never be stored here:
#   PANEL_CLIENTBUILD_GITHUB_TOKEN  fine-grained PAT (Actions RW, Metadata R)
#   PANEL_CLIENTBUILD_BUNDLE_KEY    HMAC key, at least 32 bytes
clientbuild:
  enabled: false
  publicBaseURL: ""
  assetDir: "./data/client-builds"
  rustdeskVersion: "1.5.0"
  github:
    apiBaseURL: "https://api.github.com"
    repo: ""
    workflow: "build-client.yml"
    ref: "main"
    artifactHosts:
      - "github.com"
      - "*.githubusercontent.com"
      - "*.blob.core.windows.net"
  bundle:
    ttl: 24h
  pollInterval: 30s
  pendingTimeout: 12h
  dispatchTimeout: 10m
  buildTimeout: 3h
  ingestTimeout: 1h
  artifactRetention: 720h
  deleteRemoteArtifacts: true
  maxProfilesPerOrg: 10
  maxConcurrentPerOrg: 2
  maxActiveBuilds: 4
  maxArtifactBytes: 2147483648
  platforms:
    - "windows-x64"
    - "linux-x64"
    - "macos-arm64"
    - "macos-x64"
    - "android-arm64"

# Passkey (WebAuthn) login. Disabled by default; enabling requires an RP ID and
# the exact browser origin the panel is served from. Passkeys only work over
# https (http is accepted for loopback only) and never over a bare IP origin of
# a private network, because browsers do not expose WebAuthn there.
webauthn:
  enabled: false
  rpId: ""            # e.g. "panel.example.com" — bare lowercase host, no scheme or port
  rpName: "RustDesk Control Panel"
  origin: ""          # e.g. "https://panel.example.com" — no path, query or fragment
  ceremonyTTL: 5m
  credentialsPerUser: 10
