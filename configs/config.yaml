server:
  addr: ":8080"

auth:
  # Injected from PANEL_AUTH_SECRET. Never commit a real signing key: this file
  # is published, so anyone could forge access tokens with it.
  secret: ""
  accessTTL: 15m
  refreshTTL: 168h

provision:
  portStart: 21116
  portEnd: 22115
  orgLabel: "com.rustdesk-panel.org"
  roleLabel: "com.rustdesk-panel.role"
  # Must be an address clients can reach; there is no loopback fallback.
  relayHost: "panel.example.com"
  # Pin the image tag so deployments are reproducible.
  image: "rustdesk/rustdesk-server:1.1.11"
  dataDir: "./data/servergroups"
  maxOrgsPerUser: 5
  workers: 2

database:
  driver: sqlite
  dsn: "file:data/panel.db"

log:
  level: info
  format: json

mail:
  # devMode prints outgoing messages to stdout instead of delivering them;
  # set false and fill the smtp section for real delivery.
  devMode: true
  smtp:
    host: ""
    port: 587
    username: ""
    # The SMTP password must NOT be stored here: it is injected via the
    # PANEL_SMTP_PASSWORD environment variable (same policy as the JWT key).
    from: ""

web:
  # Frontend origin used to build the links inside outgoing emails
  # (verify-email, invitation accept). Override with PANEL_WEB_BASE_URL.
  baseURL: "http://localhost:5173"

# hbbs/hbbr log collection.
#
# The collector follows `docker logs -f -t <container>` and merges the
# container's stdout AND stderr (the RustDesk server logs to stderr by
# default). On the first connection it follows only new lines (--tail 0):
# history is not backfilled, so enabling the collector does not replay the
# existing log into duplicate rows. A reconnect resumes from the last
# observed timestamp.
#
# Rules are evaluated in order, the first match wins. Named capture groups
# become the event detail; the special group "device" carries the RustDesk id
# and links the event (plus an auxiliary heartbeat) to the device. Unmatched
# lines are counted and dropped; the panel warns once a minute when that
# happens, so a wrong rule set cannot stay silent.
#
# The defaults below follow env_logger's format used by the pinned
# rustdesk-server image:
#   [2026-10-20T06:00:00Z INFO  hbbs] connection from 123456789
# Verify against `docker logs -t panel-org-<id>-hbbs` before enabling.
# Collected events are kept for 30 days (pruned at startup).
logcollect:
  enabled: false
  containerPrefix: "panel-org"
  rules:
    - name: file-transfer
      pattern: '^\[\S+\s+INFO\s+[^\]]*\].*(?:file|transfer).*?(?P<device>\d{6,12})'
      level: info
      kind: file
    - name: connection
      pattern: '^\[\S+\s+INFO\s+[^\]]*\]\s+.*?(?P<device>\d{6,12})'
      level: info
      kind: conn
    - name: warnings
      pattern: '^\[\S+\s+WARN\s+[^\]]*\]\s+(?P<msg>.*)$'
      level: warn
      kind: other
    - name: errors
      pattern: '^\[\S+\s+ERROR\s+[^\]]*\]\s+(?P<msg>.*)$'
      level: error
      kind: error
