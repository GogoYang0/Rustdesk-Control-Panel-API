openapi: 3.1.0
info:
  title: Rustdesk-Control-Panel API
  version: 0.12.2
  contact:
    name: Rustdesk-Control-Panel
    url: https://github.com/GogoYang0/Rustdesk-Control-Panel-API
  description: |
    Rustdesk-Control-Panel 控制平面 API。

    本文件是系列唯一契约事实源：WEB 与 APP 的客户端类型由此生成。
    破坏性变更需升主版本（见设计文档 C10）；0.x 阶段破坏性变更以 minor 承载。
    0.3.0 破坏性变更：Invitation.token 不再随响应返回（邀请令牌仅通过邮件投递，
    修复 #17 邮箱所有权缺口）。

    0.4.0 新增**会话治理域**：会话记录（sessions）、连接策略（policies）、
    敏感操作审批（approvals）、连接票据（tickets，挂在 sessions 标签下）与
    策略违规告警（alerts）。既有端点的**请求/响应形状与字段不变**。

    但 `ErrorCode` 新增了 `approval_required`（票据签发被策略的事前审批要求阻断时
    返回，附 `data.approval_id`）——它是所有响应共用的 `code` 类型，**对穷尽式
    `switch` 或严格枚举解码的客户端属于 breaking**。重新生成类型后需要处理该分支
    （0.x 阶段按 C10 以 minor 承载）。
    分页响应本域统一为 `data.items/page/page_size/total`（会话与告警是无限增长的
    历史表，需要总数支撑 UI 翻页；既有列表端点保持原形状）。

    0.5.0 新增**设备管理增量**：`GET /orgs/{orgId}/devices`（分页列表，沿用上述
    页对象形状）与 `POST /orgs/{orgId}/devices/{deviceId}/rebind`（重置绑定：清
    `bound_uuid`、绑定代数 +1、审计留存理由）。`Device` 增加必填字段 `bound`，
    既有端点其余字段不变。**不提供 DELETE**：换机/重装后的绑定恢复用 rebind。

    统一响应包：所有业务响应为 `{code, message, data}`。
    `code` 为机器可读错误码（见 ErrorCode），成功时为 `ok`。

    0.6.0 新增**成员离场**：`DELETE /orgs/{orgId}/members/{userId}` 与
    `PATCH /orgs/{orgId}/members/{userId}`（仅 admin↔member）。两者在变更会籍的
    同一事务内撤销该用户在本组织的活跃 compat 会话（#39）；撤销失败整体回滚。

    0.7.0 新增**按组织 provisioning 开关**：`GET/PUT /orgs/{orgId}/provisioning`
    （仅 owner）。关闭会同步下线容器、释放端口并在同一事务写审计；开启只清除
    标记，部署由供应队列异步执行。状态取值为
    `disabled|pending|provisioning|deployed|failed`；`cleanup_pending` 区分
    “关闭意图已记录”与“容器清理已完成”。

    0.8.0 新增**角色模型**：权限判定改为 `memberships.role_id → roles.permissions`，
    owner/admin/member 变为内置角色行，组织可创建自定义角色并授予。
    新增 `GET /permissions` 权限目录与 `/orgs/{orgId}/roles` 系列端点；
    `Member` 增加 `role_id`、`role_name`、`disabled`，`role` 不再限定为内置三种
    （自定义角色名会出现在该字段，等价于 `role_name`）。`PATCH members` 请求体
    改为按字段的 `MemberUpdateRequest`（`role_id` / `disabled`）。

    0.9.0 新增**访问控制域**（对齐 RustDesk Server Pro Access Control，只做准入，
    不含会话内 Control Role）：用户组、设备组与只有 allow 的组规则。
    `Device` 增加 `device_group_id`（null 表示未分组；一台设备只能属于一个
    设备组）。普通成员的 `GET /api/peers` 只返回规则允许的设备，票据签发与
    兑换按同一判定拒绝（返回 404，不泄露设备存在性）。`Permission` 新增
    `access.manage`（owner 拥有；admin 由内置集合授予；不可委派）。

    0.10.0 新增**客户端策略下发与心跳断连**：`/orgs/{orgId}/strategies` 系列端点
    维护 `config_options`（20 个白名单键），策略按「设备 > 设备组 > 成员」三层
    生效，经 `POST /api/heartbeat` 响应下发给客户端；`Permission` 新增
    `strategy.manage`、`device.disconnect`（均不可委派）。

    0.10.0 波次 5a 新增**自定义客户端生成器**：组织级品牌 profile、构建记录与
    产物下载；构建由 GitHub Actions 执行，服务器地址/公钥/API server 由本组织
    已部署的 `ServerGroup`、`relayHost` 与 `publicBaseURL` 推导，API server 指向
    面板 compat 入口。平台为 windows-x64、linux-x64、macos-arm64、macos-x64、
    android-arm64；5a **不签名**（Android 使用固定 debug key）。新增权限
    `client_build.manage`（owner/admin，不可委派）。
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: system
    description: 运维与自检接口
  - name: auth
    description: 认证与令牌
  - name: orgs
    description: 组织与成员
  - name: devices
    description: 设备与心跳
  - name: addressbooks
    description: 地址簿（个人/共享）
  - name: logs
    description: 采集日志查询（audit.read + audit_scope）
  - name: sessions
    description: 会话记录（面板签发与日志推断）与连接票据
  - name: policies
    description: 连接策略（并发、时长、时段、事前审批）
  - name: approvals
    description: 敏感操作审批（事前阻断与事后追认）
  - name: alerts
    description: 策略违规告警
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 存活探针
      description: 返回进程存活状态，不需要认证。
      tags:
        - system
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok

  /api/v1/auth/login:
    post:
      operationId: login
      summary: 邮箱密码登录
      description: 校验邮箱与密码，返回 access/refresh 令牌对。受 IP 与账号双轨限流（429）。邮箱未验证的账号返回 403（code=email_not_verified）。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: 验证码提供商不可用（仅启用验证码且 failMode=closed 时）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/providers:
    get:
      operationId: listAuthProviders
      summary: 列出可用的登录方式
      description: |
        未认证。返回部署级启用的外部身份源：`oidc` 反映 `oidc.enabled`（同时给出
        `name` 作为按钮文案），`ldap` 在本版本恒为 false（未实现，配置开启会启动失败）。
        前端据此显示「使用 {name} 登录」入口。
      tags:
        - auth
      security: []
      responses:
        "200":
          description: 登录方式
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvidersResponse"

  /api/v1/auth/oidc/start:
    post:
      operationId: startOIDCLogin
      summary: 开始 OIDC 登录
      description: |
        未认证。返回浏览器必须跳转的 `authorization_url`。流程为
        Authorization Code + PKCE(S256) + nonce；`state` 一次性（默认 10 分钟）。
        回调地址固定为 `{web.baseURL}/api/v1/auth/oidc/callback`，不接受请求指定。

        `redirect_path` 是登录成功后前端回到的站内路径：必须以 `/` 开头，且不含
        `//`、反斜杠、`:`、`..`、百分号编码的分隔符（`%2f`/`%5c`），长度 ≤256；
        缺省为 `/`。非法值返回 400 且不会创建流程行。

        `oidc.enabled=false` 或 IdP 的 discovery 不可达时返回 503 —— 不降级为
        密码登录，也不返回 500。
      tags:
        - auth
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCStartRequest"
      responses:
        "200":
          description: 授权请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: OIDC 未启用或 IdP 不可达
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/oidc/callback:
    get:
      operationId: handleOIDCCallback
      summary: OIDC 回调
      description: |
        未认证。IdP 重定向到这里。成功时 302 到
        `{web.baseURL}{redirect_path}?ticket=…`，失败时 302 到同一路径并带
        `?error=<oidc_failed|no_account|email_unverified|identity_conflict>`。

        URL 中**不出现任何 token**（access/refresh/id_token 都不进查询串）；
        ticket 有效期 60 秒、一次一用。请求里的 `redirect_uri` 被忽略，
        `Location` 只由 `web.baseURL` 与启动时校验过的站内路径拼成。
        IdP 返回的 `error`/`error_description` 原文不回显、不入日志。
      tags:
        - auth
      security: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: IdP 的错误码；只用于判定失败，不记录原文
      responses:
        "302":
          description: 重定向回前端（带 ticket 或固定错误码）
          headers:
            Location:
              schema:
                type: string
        "503":
          description: OIDC 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/oidc/exchange:
    post:
      operationId: exchangeOIDCLogin
      summary: 用 ticket 换取令牌
      description: |
        未认证。把回调带回来的 ticket 换成与密码登录相同的 token 对。
        ticket 一次有效（60 秒），重放或伪造一律 401。

        `external.requireLocalSecondFactor=true` 且该账户**已启用** TOTP 时，
        返回 401 `two_factor_required` 与 `challenge_token`（`methods:["totp"]`），
        客户端继续调用 `POST /auth/2fa/verify`；未启用 TOTP 的账户直接发 token。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCExchangeRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: OIDC 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/identity:
    get:
      operationId: getIdentities
      summary: 查看外部身份绑定
      description: |
        需要登录（JWT）。返回当前账户的全部外部身份绑定（按绑定时间倒序），
        以及 `active_provider`（当前部署启用的外部身份源）。
        `conflict_at` 非空表示该绑定已被标记冲突：SSO 会拒绝它，
        需要管理员 reset 后才能重绑（设计 O4/O14）。
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 绑定列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: 外部身份源未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/identity/unlink:
    post:
      operationId: unlinkIdentity
      summary: 解绑外部身份
      description: |
        需要登录（JWT）+ 二次证明：`stepup_token`（passkey step-up）或当前密码，
        **二者给其一**（都给或缺一 → 400）。

        拒绝会锁死账户的解绑：账户没有密码、没有 passkey、且这是唯一一条绑定
        时返回 409 —— 此类账户没有任何线上自救通道。
        `identity_id` 不属于当前账户时返回 404（不区分“不存在”与“不是你的”）。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityUnlinkRequest"
      responses:
        "200":
          description: 已解绑
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/orgs/{orgId}/members/{userId}/identity/reset:
    post:
      operationId: resetMemberIdentity
      summary: 重置成员的外部身份绑定
      description: |
        管理员清空成员的外部身份绑定（需要 `member.manage`），写审计
        `user.identity.reset`。守卫与 `2fa/reset`、`passkeys/reset` 一致：
        不能重置自己；重置 owner 需要 `org.admin`；目标同属其他组织时拒绝；
        事务内复判。

        例外（设计 O14）：目标没有本地凭据（无密码、无 passkey）且仍有
        **未冲突**的绑定时返回 409 —— 清空绑定会让它彻底无法登录；
        但全部绑定都已标记 `conflict_at` 时，SSO 本来就登不进，
        此时 reset 是管理员唯一的修复手段，予以放行。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已重置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/ldap/login:
    post:
      operationId: ldapLogin
      summary: 目录账号登录
      description: |
        未认证。服务账号搜索到恰好一条目录条目后，以该条目 DN 做用户 bind 验证
        密码；成功后按目录 `mail` 属性绑定到**已存在**的面板账户（无 JIT），
        返回与密码登录相同的 token 对。

        空用户名或空密码返回 400 且**不会触碰目录**（L1：空密码 + simple bind
        在多数目录上等于匿名 bind）。bind 失败一律 401「用户名或密码错误」，
        不区分用户不存在与密码错；目录连接/TLS/搜索协议错误返回 503；搜索
        命中多于一条也按 401 拒绝（filter 太宽 = fail closed，L6）。

        限流与验证码与 `/auth/login` 同源（同一 IP 桶与失败窗口，L9）。
        `external.requireLocalSecondFactor=true` 且该账户已启用 TOTP 时，
        返回 401 `two_factor_required` + `challenge_token`，由
        `POST /auth/2fa/verify` 完成第二步（与 OIDC 同一收尾逻辑，L12）。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LDAPLoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 目录身份与已有绑定冲突（换用户名后撞新 subject 等）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: LDAP 未启用或目录不可达
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/captcha:
    get:
      operationId: getCaptchaChallenge
      summary: 获取交互式验证码挑战
      description: |
        未认证。返回当前启用的验证码提供商与客户端所需参数：
        `altcha` 返回挑战 JSON（algorithm/challenge/maxNumber/salt/signature）；
        `geetest` 返回 `captcha_id` 与 widget 脚本地址；`cap` 返回
        `api_endpoint` 与 `site_key`。未启用时 `enabled=false` 且不含
        provider/challenge。受独立 IP 限流（429）。
      tags:
        - auth
      security: []
      responses:
        "200":
          description: 当前验证码配置与挑战
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptchaChallengeResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: 验证码提供商不可用（构造挑战失败）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      summary: 轮换 refresh 令牌
      description: |
        校验 refresh 令牌并轮换：旧令牌立即撤销，返回新的令牌对。
        重放已撤销令牌会撤销该用户全部 refresh 令牌，需重新登录。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 轮换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/tokens:
    get:
      operationId: listTokens
      summary: 列出个人访问令牌
      description: |
        返回当前用户在某组织内的个人令牌（v0.8.0，不返回明文）。需要 JWT 身份
        （个人令牌本身不能管理令牌）。
      tags:
        - auth
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 令牌列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createToken
      summary: 创建个人访问令牌
      description: |
        签发一个绑定到单个组织的个人令牌（v0.8.0）。明文只在创建响应中出现一次；
        服务端只存 SHA-256。`permissions` 省略时取当前角色的全部权限，给出时必须是
        当前角色权限的子集（不能借令牌提权）。每人每组织最多 20 个活跃令牌。
        有效期 `expires_in_days` 1..365，默认 90。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreateRequest"
      responses:
        "201":
          description: 已创建（含一次性明文）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedAPITokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/tokens/{tokenId}:
    delete:
      operationId: revokeToken
      summary: 撤销个人访问令牌
      description: 撤销当前用户名下的一个个人令牌（v0.8.0）；重复撤销幂等，他人令牌返回 404。
      tags:
        - auth
      security:
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/2fa/setup:
    post:
      operationId: setupTOTP
      summary: 初始化 TOTP 两步验证
      description: |
        生成新的 TOTP 秘密并返回 `otpauth://` URI（v0.8.0）。秘密在用户完成
        `/auth/2fa/enable` 之前不生效；已启用时再次调用返回 409。
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 秘密与 provisioning URI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/2fa/enable:
    post:
      operationId: enableTOTP
      summary: 启用 TOTP 两步验证
      description: 校验首个 TOTP 码后启用（v0.8.0）。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: 已启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/2fa/disable:
    post:
      operationId: disableTOTP
      summary: 关闭 TOTP 两步验证
      description: 需要当前密码 + 一个有效的 TOTP 码或恢复码（v0.8.0）。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPDisableRequest"
      responses:
        "200":
          description: 已关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 账户没有本地密码（passkey-only），无法启用或维护 TOTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/2fa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: 重新生成恢复码
      description: 需要当前密码 + 有效 TOTP 码或恢复码；返回 10 个一次性恢复码（只出现一次，v0.8.0）。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPDisableRequest"
      responses:
        "200":
          description: 新的恢复码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPRecoveryCodesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 账户没有本地密码（passkey-only），无法启用或维护 TOTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/2fa/verify:
    post:
      operationId: verifyTOTP
      summary: 登录第二步校验
      description: |
        使用登录返回的短期 `challenge_token` 与 TOTP 码（或一次性恢复码）完成登录
        （v0.8.0）。成功返回与 `/auth/login` 相同的令牌对。

        挑战令牌本身不是一次性凭据：它在签发后 5 分钟内有效，期间可重复提交校验。
        一次性的是凭据——每个 TOTP 码仅在对应时间步内可用（同一时间步不可重放），
        每个恢复码只能成功使用一次。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPVerifyRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: 验证码提供商不可用（仅启用验证码且 failMode=closed 时）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/passkey/stepup/begin:
    post:
      operationId: beginPasskeyStepup
      summary: 开始 step-up 断言
      description: |
        需要登录（JWT）。为敏感操作（删除/恢复本地密码）发起一次新鲜断言。
        账户没有 passkey 时 409；断言有效期由 `webauthn.ceremonyTTL` 决定（默认 5 分钟）。
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 断言挑战
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremonyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/passkey/stepup/finish:
    post:
      operationId: finishPasskeyStepup
      summary: 完成 step-up 断言
      description: |
        需要登录（JWT）。校验断言后返回 2 分钟、**一次一用**的 `stepup_token`。
        该令牌只能授权一个敏感动作；重放返回 401。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginRequest"
      responses:
        "200":
          description: step-up 令牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepupTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/password/remove:
    post:
      operationId: removePassword
      summary: 删除本地密码（转为 passkey-only）
      description: |
        需要登录（JWT）+ 一次**新鲜的 passkey 断言**（`stepup_token`，2 分钟、一次一用）。
        四项前置条件全部满足才执行：当前密码正确；stepup 有效；已绑定 passkey ≥ 2；
        账户没有任何 TOTP 配置（含未启用的 pending 行）。

        成功后 `password_hash` 置空，密码登录返回通用 `unauthorized`，只能走 passkey。
        **没有线上自救通道**：删除后若丢失全部 passkey，只能由部署方按运维手册处理。
        响应 `warnings` 列出连带影响（compat 登录不可用等）。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRemoveRequest"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordRemoveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/password/set:
    post:
      operationId: setPassword
      summary: 恢复本地密码
      description: |
        需要登录（JWT）+ 一次新鲜的 passkey 断言。仅当账户**当前没有密码**时可用
        （已有密码返回 409；本版本不提供改密）。用于 passkey-only 账户恢复密码登录。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordSetRequest"
      responses:
        "200":
          description: 已设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/passkeys:
    get:
      operationId: listPasskeys
      summary: 列出我的 passkey
      description: |
        需要登录（JWT）。返回调用者自己的凭据，附带 `has_password` 与
        `totp_enabled`，供客户端判断"删除最后一个凭据会不会锁死账户"。
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 凭据列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/passkeys/{passkeyId}:
    patch:
      operationId: renamePasskey
      summary: 重命名 passkey
      description: 需要登录（JWT）。名称 1-64 字符，首尾空白会被裁剪。只能操作自己的凭据。
      tags:
        - auth
      security:
        - bearerAuth: []
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyNameRequest"
      responses:
        "200":
          description: 更新后的凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePasskey
      summary: 删除 passkey
      description: |
        需要登录（JWT）。账户**没有密码**且这是最后一个凭据时返回 409：
        删除会让账户再也无法登录，必须先设置密码或再绑定一个凭据。
        不属于调用者的凭据一律 404，不区分"不存在"与"非本人"。
      tags:
        - auth
      security:
        - bearerAuth: []
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/passkey/login/begin:
    post:
      operationId: beginPasskeyLogin
      summary: 开始 passkey 登录
      description: |
        未认证。三种入口，互斥：

        - 带 `challenge_token`：密码已通过、账户开启了 TOTP，此时用 passkey 代替
          TOTP 完成第二步；`allowCredentials` 限定为该账户的凭据。账户没有凭据时 409。
        - 带 `email`：把 `allowCredentials` 收窄到该邮箱的凭据；**邮箱不存在或
          账户没有凭据时仍返回 200**，退化为可发现凭据 ceremony（不带
          `allowCredentials`）。`email` 只是提示。

          **安全边界说明**：命中与未命中的差别只在 `allowCredentials` 的内容，
          状态码与结构一致。因此响应用途上可区分"该邮箱是否已绑定 passkey"——
          这是为了让浏览器只列出相关凭据而显式接受的取舍（设计 D16），**不要**
          把响应形状当作保密边界；探测成本由 per-IP 限流约束。

          要彻底消除该差异，**必须在服务端或入口网关拒绝 `email` 参数**：端点公开，
          客户端不发送并不能阻止第三方直接提交。本版本无内置开关，属已知限制。
        - 都不带：可发现凭据（usernameless）流程，由认证器选择账户。

        受 per-IP 限流；`email` 分支额外按账户计失败窗口。
      tags:
        - auth
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginBeginRequest"
      responses:
        "200":
          description: 断言挑战
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremonyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/passkey/login/finish:
    post:
      operationId: finishPasskeyLogin
      summary: 完成 passkey 登录
      description: |
        未认证。校验断言并签发与 `/auth/login` 相同的令牌对。
        `ceremony_token` 一次有效；重放、过期、origin/rpId/challenge 不符、
        签名无效一律 401，不区分原因。签名计数器回退按克隆处置（401），
        凭据被标记 `clone_warning` 且不会自动删除。

        passkey 登录成功即视为完成认证，不再叠加本地 TOTP（设计 D1/D14）。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/passkey/register/begin:
    post:
      operationId: beginPasskeyRegistration
      summary: 开始绑定 passkey
      description: |
        需要登录（JWT）。返回一次性 `ceremony_token` 与 `navigator.credentials.create()`
        所需的 `options`（W3C 标准 JSON，顶层为 `publicKey`）。字段按 W3C 结构透传，
        契约不重复建模，避免与标准漂移；其中的二进制字段是 **base64url 字符串**，
        客户端必须先解码为 `ArrayBuffer` 再调用 WebAuthn API（见
        `PasskeyCeremony.options` 的说明与 `docs/reference/passkey-smoke.html`）。

        认证器策略固定：`userVerification=required`、`residentKey=preferred`、
        `attestation=none`；`excludeCredentials` 含该账户已绑定的凭据。
        `webauthn.enabled=false` 时返回 503；账户已达凭据上限时返回 409。
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 注册挑战
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremonyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/passkey/register/finish:
    post:
      operationId: finishPasskeyRegistration
      summary: 完成绑定 passkey
      description: |
        需要登录（JWT）。提交浏览器 `navigator.credentials.create()` 的结果。
        `ceremony_token` 一次有效（有效期由 `webauthn.ceremonyTTL` 决定，默认 5 分钟），重放返回 401。

        校验失败（origin/rpId 不符、challenge 不符、签名无效）一律 401，不区分原因；
        同一凭据已绑定到任何账户时 409，且不回显归属账户。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistrationRequest"
      responses:
        "201":
          description: 已绑定的凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/me:
    get:
      operationId: getMe
      summary: 当前用户与所属组织
      description: |
        一次返回调用者自身的资料，以及在每个**有效**组织会籍下的角色与权限码。
        停用会籍、以及 `role_id` 指向不存在角色的会籍**不出现**在 `orgs` 中（fail closed，
        与逐请求鉴权一致）。`permissions` 是只读快照，供前端做交互闸门，不构成授权；
        后端仍在每次请求上独立鉴权。
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户与其组织
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs:
    get:
      operationId: listOrgs
      summary: 列出当前用户所属组织
      description: 返回调用者已加入的全部组织，按组织 id 升序。
      tags:
        - orgs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 组织列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrg
      summary: 创建组织
      description: 创建组织并将调用者设为 owner。
      tags:
        - orgs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/members:
