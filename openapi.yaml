          （v0.10.0；`target_group_id` 必填）。目标为内置 `everyone` 组时语义是
          「所有由**有效成员**归属的设备」（停用/无角色/已移除会籍的归属人贡献空集）
        - all_devices：规则指向组织内全部设备（`target_group_id` 必须为空）
      enum:
        - device_group
        - user_group
        - all_devices

    AccessRule:
      type: object
      required:
