        `status=pending` 拉取待办。组织成员即可读取（审批中心对 member 只读）。
      tags:
        - approvals
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
