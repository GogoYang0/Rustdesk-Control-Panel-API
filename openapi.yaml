        列出共享簿的授权（v0.8.0）。需要 `full` 访问：`addressbook.write` 权限或
        该簿的 `full` 授权。个人簿没有授权概念，返回 400。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 授权列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookGrantListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAddressBookGrant
      summary: 新增或更新共享地址簿授权
      description: |
        为共享簿授予按用户或 `everyone` 的访问级别（v0.8.0）。需要 `full` 访问。
        同一主体重复授权时改为更新其访问级别（201 创建 / 200 更新）。用户主体必须
        是本组织成员。`user` 授权的优先级高于 `everyone`。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBookGrantRequest"
      responses:
        "200":
          description: 已更新授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookGrantResponse"
        "201":
          description: 已创建授权
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookGrantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

