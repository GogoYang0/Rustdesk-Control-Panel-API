openapi: 3.1.0
info:
  title: Rustdesk-Control-Panel API
  version: 0.4.0
  contact:
    name: Rustdesk-Control-Panel
    url: https://github.com/GogoYang0/Rustdesk-Control-Panel-API
  description: |
    Rustdesk-Control-Panel 控制平面 API。

    本文件是系列唯一契约事实源：WEB 与 APP 的客户端类型由此生成。
    破坏性变更需升主版本（见设计文档 C10）；0.x 阶段破坏性变更以 minor 承载。
    0.3.0 破坏性变更：Invitation.token 不再随响应返回（邀请令牌仅通过邮件投递，
    修复 #17 邮箱所有权缺口）。

    0.4.0 新增**会话治理域**：会话记录（sessions）、连接策略（policies）、
    敏感操作审批（approvals）、连接票据（tickets，挂在 sessions 标签下）与
    策略违规告警（alerts）。既有端点与数据结构**形状不变**；ErrorCode 仅新增
    `approval_required`（票据签发被策略的事前审批要求阻断时返回，附待审批 id）。
    分页响应本域统一为 `data.items/page/page_size/total`（会话与告警是无限增长的
    历史表，需要总数支撑 UI 翻页；既有列表端点保持原形状）。

    统一响应包：所有业务响应为 `{code, message, data}`。
    `code` 为机器可读错误码（见 ErrorCode），成功时为 `ok`。
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: system
    description: 运维与自检接口
  - name: auth
    description: 认证与令牌
  - name: orgs
    description: 组织与成员
  - name: devices
    description: 设备与心跳
  - name: addressbooks
    description: 地址簿（个人/共享）
  - name: logs
    description: 采集日志查询
  - name: sessions
    description: 会话记录（面板签发与日志推断）与连接票据
  - name: policies
    description: 连接策略（并发、时长、时段、事前审批）
  - name: approvals
    description: 敏感操作审批（事前阻断与事后追认）
  - name: alerts
    description: 策略违规告警
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 存活探针
      description: 返回进程存活状态，不需要认证。
      tags:
        - system
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok

  /api/v1/auth/login:
    post:
      operationId: login
      summary: 邮箱密码登录
      description: 校验邮箱与密码，返回 access/refresh 令牌对。受 IP 与账号双轨限流（429）。邮箱未验证的账号返回 403（code=email_not_verified）。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      summary: 轮换 refresh 令牌
      description: |
        校验 refresh 令牌并轮换：旧令牌立即撤销，返回新的令牌对。
        重放已撤销令牌会撤销该用户全部 refresh 令牌，需重新登录。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 轮换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/orgs:
    get:
      operationId: listOrgs
      summary: 列出当前用户所属组织
      description: 返回调用者已加入的全部组织，按组织 id 升序。
      tags:
        - orgs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 组织列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrg
      summary: 创建组织
      description: 创建组织并将调用者设为 owner。
      tags:
        - orgs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/members:
    get:
      operationId: listMembers
      summary: 列出组织成员
      description: 返回指定组织的成员及其组织内角色；调用者必须是该组织成员。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 成员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/invitations:
    post:
      operationId: createInvitation
      summary: 邀请成员加入组织
      description: 生成邀请令牌（服务端只存哈希），有效期 7 天，并通过邮件发送给受邀邮箱；令牌不出现在响应中（issue #17）。需要 member.manage 权限。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
      responses:
        "201":
          description: 邀请已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: 接受邀请
      description: 使用邀请令牌加入组织；令牌过期或已使用返回 409。
      tags:
        - orgs
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptRequest"
      responses:
        "200":
          description: 已加入组织
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/devices:
    post:
      operationId: createDevice
      summary: 注册设备
      description: 在当前组织下登记一台 RustDesk 设备。需要 device.write 权限。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreateRequest"
      responses:
        "201":
          description: 设备已登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/address-books:
    get:
      operationId: listAddressBooks
      summary: 列出地址簿
      description: |
        返回调用者可见的地址簿：个人地址簿（owner 为调用者）与共享地址簿。
        需要组织成员身份；shared 地址簿的写操作才需要 addressbook 权限。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 地址簿列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAddressBook
      summary: 创建地址簿
      description: |
        创建地址簿。personal 由调用者拥有；shared 需要组织管理权限。
        同名同 scope 重复创建返回 409。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBookCreateRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/address-books/{bookId}:
    get:
      operationId: getAddressBook
      summary: 地址簿详情（含 peers 与 tags）
      description: 返回单个地址簿及其 peers 与 tags；无权访问或不存在返回 404。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 地址簿详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateAddressBook
      summary: 更新地址簿名称
      description: personal 仅 owner 可改；shared 需要组织管理权限。scope 创建后不可变更。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBookUpdateRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAddressBook
      summary: 删除地址簿（级联删除 peers 与 tags）
      description: 删除地址簿及其全部 peers 与 tags；不可恢复。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/address-books/{bookId}/peers:
    put:
      operationId: replaceAddressBookPeers
      summary: 全量替换地址簿 peers
      description: |
        以请求体完整替换该地址簿的 peers 列表，revision 递增。
        并发替换为最后写入者生效；revision 只用于客户端同步对比，服务端不校验客户端提交的版本。
        需要冲突检测时请走 `/api/ab`（legacy 整本写入带 content hash，冲突返回 409）——该路径只服务个人地址簿，共享地址簿没有冲突检测。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBookPeersReplaceRequest"
      responses:
        "200":
          description: 已替换
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/address-books/{bookId}/tags:
    put:
      operationId: replaceAddressBookTags
      summary: 全量替换地址簿标签
      description: 以请求体完整替换该地址簿的标签列表，revision 递增。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBookTagsReplaceRequest"
      responses:
        "200":
          description: 已替换
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/log-events:
    get:
      operationId: listLogEvents
      summary: 查询采集日志事件
      description: 返回本组织采集的 hbbs/hbbr 日志事件，按发生时间倒序，limit 上限 200。
      tags:
        - logs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum:
              - info
              - warn
              - error
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 日志事件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEventListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: 邮箱验证
      description: 使用邮件中的验证令牌完成邮箱验证；令牌过期或已使用返回 409。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationRequest"
      responses:
        "200":
          description: 验证成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: 重发验证邮件
      description: |
        无论邮箱是否存在均返回 200（防枚举）；存在未验证账号时才真正发送。
        受限流保护。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: 请求已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/orgs/{orgId}/devices/{deviceId}/heartbeat:
    post:
      operationId: deviceHeartbeat
      summary: 设备心跳
      description: 上报设备在线心跳，刷新 last_seen_at。需要 device.write 权限。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 心跳已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/sessions:
    get:
      operationId: listSessions
      summary: 会话记录列表
      description: |
        本组织的会话记录，按 `started_at` 倒序（同秒按 `id` 倒序，保证翻页稳定），
        分页返回。组织成员即可读取。

        `origin` 区分两类来源：`panel`（面板签发：网页客户端与地址簿下发的连接
        票据，策略强制且可事前阻断）与 `native`（原生客户端直连，由 hbbs/hbbr
        日志采集推断，只记录不阻断）。`denied` 状态的会话只出现在 `panel` 来源，
        表示签发阶段即被策略拒绝，用于留痕。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: origin
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionOrigin"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionStatus"
        - name: deviceId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: since
          in: query
          required: false
          description: 起始时间（含），按 `started_at` 过滤
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: 结束时间（含），按 `started_at` 过滤
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: 会话详情（含事件序列）
      description: |
        返回单个会话及其事件序列（`started`/`approved`/`denied`/`closed` 等，
        按时间正序）。事件序列是审计留痕：超过 200 条时只返回最早 200 条并置
        `truncated=true`。组织成员即可读取。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/policies:
    get:
      operationId: listPolicies
      summary: 连接策略列表
      description: |
        本组织的连接策略（单次返回全部，不分页）。组织成员即可读取。

        评估票据签发时**所有 `enabled` 策略同时生效**，各维度取最严约束
        （并发/时长的最小值、时段的交集、任一条要求审批即需审批）。时段按模 1440
        求交（跨零点窗口先展开成区间再取交），**交集为空表示该时段完全禁止**。
      tags:
        - policies
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 策略列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPolicy
      summary: 创建连接策略
      description: |
        需要 `owner`/`admin` 角色。创建即生效（`enabled` 由请求体显式给出）。
        同一组织内策略 `name` 唯一，重复创建返回 `409 conflict`。
      tags:
        - policies
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/policies/{policyId}:
    put:
      operationId: updatePolicy
      summary: 更新连接策略
      description: |
        全量更新策略：`enabled`/`require_approval` 必填，限额字段为 null 表示「不限」。
        需要 `owner`/`admin` 角色。改名撞上同组织内其他策略返回 `409 conflict`。
      tags:
        - policies
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: policyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deletePolicy
      summary: 删除连接策略
      description: 删除后该策略不再参与评估；已签发的票据保留签发时的策略快照。需要 `owner`/`admin` 角色。
      tags:
        - policies
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: policyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/approvals:
    get:
      operationId: listApprovals
      summary: 审批请求列表
      description: |
        本组织的审批请求，按 `requested_at` 倒序（同秒按 `id` 倒序），分页返回。审批中心按
        `status=pending` 拉取待办。组织成员即可读取（审批中心对 member 只读）。
      tags:
        - approvals
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
        - name: deviceId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 审批请求列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createApproval
      summary: 提交审批请求
      description: |
        为指定设备提交事前审批请求（默认 15 分钟有效）。组织成员均可提交；
        组织无需审批时也可提交，但票据签发并不依赖它——是否需要审批由策略决定。

        同一 actor + 设备已存在 `pending` 的事前审批时**复用**该请求（返回 200 与
        既有请求），不重复创建。`kind=ratification` 不参与复用判断。
      tags:
        - approvals
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCreateRequest"
      responses:
        "201":
          description: 已创建待审批请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "200":
          description: 复用既有待审批请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      summary: 审批决定（approve/deny）
      description: |
        需要 `owner`/`admin` 角色。只有 `pending` 请求可决策；已决策或已过期返回
        `409 conflict`。

        - `kind=pre_approval`：`approve` 后该 actor 对该设备的**下一次**票据签发不再
          被审批阻断。审批本身不签发任何东西（不返回 token）——客户端重试
          `POST .../tickets` 才拿到票据，审批与票据**一次性绑定**（签发票据即消费审批）。

          消费点在签发而不是兑换：票据过期（默认 300 秒）**不退还审批**，需要重新申请。
          这样"一次审批 = 一次签发许可"的语义最简单，也不会因为客户端反复兑换失败
          而重复消耗审批。
        - `kind=ratification`：`approve` 即「已追认」，仅改状态并落审计，
          不产生票据、不消费任何额度（`ticket_id` 恒为 null）。

        `expires_at` 对两类一致：请求时刻 + 15 分钟；超期未决策由后台任务置 `expired`。
        已结束的原生会话同样可以追认（追认针对已发生的事实，与连接是否还在无关）。
      tags:
        - approvals
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: approvalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: 决策结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/tickets:
    post:
      operationId: issueTicket
      summary: 签发连接票据
      description: |
        为一次远控签发一次性、短时效的连接票据（默认 300 秒，范围 30–900）。
        组织成员均可签发（是否放行由策略决定，不看角色）。

        签发前评估**时段**与**审批要求**：时段外返回 `409 conflict`；策略要求事前
        审批而该 actor 对设备没有已批准且未消费的审批时返回 `409 approval_required`，
        `data.approval_id` 指向新建或复用的待审批请求——审批通过后重试本端点即可。

        **并发上限与时长上限不在这里评估**：签发不产生会话，此刻看不到任何新会话，
        在这里判并发等于恒不超限。并发在兑换时复查（见
        `POST .../tickets/{ticketId}/redeem`），时长是后置处理（超时由后台任务关闭
        会话并告警，不掐断真实连接——面板不在信令链路上）。

        明文 `token` **仅在本次响应中返回一次**，服务端只保存摘要。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCreateRequest"
      responses:
        "201":
          description: 已签发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            策略阻断：`approval_required`（需事前审批，`data.approval_id` 为待审批
            请求）或 `conflict`（时段外等约束不满足）
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ApprovalRequiredResponse"
                  - $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orgs/{orgId}/alerts:
    get:
      operationId: listAlerts
      summary: 策略违规告警列表
      description: |
        本组织的告警，按 `created_at` 倒序（同秒按 `id` 倒序），分页返回。告警由两条路径产生：面板
        签发路径在并发/时长/时段约束不满足时实时产生；原生直连路径由日志采集推断
        的会话触发（只告警、不阻断）。事前审批阻断不产生告警（见 Alert.kind）。
        与 open 会话归并的 panel 日志事件不产生 native 告警（见 Session 生命周期）。
        组织成员即可读取。
      tags:
        - alerts
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AlertSeverity"
        - name: kind
          in: query
          required: false
          description: 告警类型（自由字符串，见 Alert.kind 的已知取值）
          schema:
            type: string
            maxLength: 64
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 告警列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/approvals/{approvalId}:
    get:
      operationId: getApproval
      summary: 审批请求详情
      description: 单个审批请求（审批中心深链）。组织成员即可读取。
      tags:
        - approvals
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: approvalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 审批请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/tickets/{ticketId}:
    get:
      operationId: getTicket
      summary: 票据详情
      description: |
        票据的记账状态（是否已兑换、过期、撤销）。明文 token **不会**返回。
        组织成员即可读取。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 票据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/tickets/{ticketId}/redeem:
    post:
      operationId: redeemTicket
      summary: 兑换连接票据（创建面板会话）
      description: |
        兑换一次性票据：在**同一个事务**里复查并发与时段 → 原子占用 `used_at` →
        创建一条 `origin=panel`、`status=open` 的会话（`started_at` 为兑换时刻），
        返回该会话。这是 open panel 会话的唯一创建入口，也是并发配额的真正闸门。

        **并发复查必须在兑换时做**：统计本组织 `status=open` 且 `origin=panel` 的会话数，
        达到策略上限就拒绝——否则「先连签 N 张票据再并行兑换」可以绕过并发上限。
        计数与插入必须在同一事务内（条件插入），否则并发兑换会同时读到旧计数。

        票据只能兑换一次：已兑换、已过期、已撤销或 token 不匹配一律返回
        `409 conflict`（不区分原因，避免探测）；并发或时段约束不满足同样返回 409
        （`conflict`，原因写在 message 里）。票据不存在或不属于本组织返回 404。
        组织成员即可兑换（M4 托管客户端若需未登录兑换，走面板内部路径，不在本契约内）。

        M3 阶段票据不注入信令（面板不在信令链路），这里是面板侧记账入口；
        网页客户端托管与票据注入见 M4。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketRedeemRequest"
      responses:
        "201":
          description: 已兑换，返回新建的会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            票据已兑换、已过期、已撤销、token 不匹配，或并发/时段约束不满足
            （统一 `conflict`，message 说明具体原因）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未认证或令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 状态冲突（重复、过期或已使用）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: 触发限流
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Internal:
      description: 服务端错误（如邀请邮件投递失败）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorCode:
      type: string
      description: |
        机器可读错误码：
        - ok：成功
        - invalid_request：参数校验失败
        - unauthorized：未认证或令牌无效
        - forbidden：权限不足
        - not_found：资源不存在
        - conflict：状态冲突（重复创建、邀请过期或已使用、验证令牌无效）
        - rate_limited：触发限流
        - internal：服务端错误
        - email_not_verified：邮箱未验证（登录被拒）
        - approval_required：票据签发被策略的事前审批要求阻断（409，`data.approval_id` 为待审批请求）
      enum:
        - ok
        - invalid_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
        - internal
        - email_not_verified
        - approval_required

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type:
            - object
            - "null"
          additionalProperties: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128

    RefreshRequest:
      type: object
      required:
