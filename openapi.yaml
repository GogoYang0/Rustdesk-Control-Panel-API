        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createApproval
      summary: 提交审批请求
      description: |
        为指定设备提交事前审批请求（默认 15 分钟有效）。组织成员均可提交；
        组织无需审批时也可提交，但票据签发并不依赖它——是否需要审批由策略决定。

        复用规则按 `kind` 区分，两种都不重复创建：

        - `pre_approval`：同一 actor + 设备已有 `pending` 请求 → 复用，返回 200
        - `ratification`：同一会话已有 `pending` 或 `approved` 的追认 → 复用，返回 200
          （同一会话被不同 approver 重复点开时不应该产生多条待办）

        首次创建返回 201。
      tags:
        - approvals
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCreateRequest"
      responses:
        "201":
          description: 已创建待审批请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "200":
          description: 复用既有待审批请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      summary: 审批决定（approve/deny）
      description: |
        需要 `owner`/`admin` 角色。只有 `pending` 请求可决策；已决策或已过期返回
        `409 conflict`。

        - `kind=pre_approval`：`approve` 后该 actor 对该设备的**下一次**票据签发不再
          被审批阻断。审批本身不签发任何东西（不返回 token）——客户端重试
          `POST .../tickets` 才拿到票据，审批与票据**一次性绑定**（签发票据即消费审批）。

          消费点在签发而不是兑换：票据过期（默认 300 秒）**不退还审批**，需要重新申请。
          这样"一次审批 = 一次签发许可"的语义最简单，也不会因为客户端反复兑换失败
          而重复消耗审批。
        - `kind=ratification`：`approve` 即「已追认」，仅改状态并落审计，
          不产生票据、不消费任何额度（`ticket_id` 恒为 null）。

        `expires_at` 对两类一致：请求时刻 + 15 分钟；超期未决策由后台任务置 `expired`。
        已结束的原生会话同样可以追认（追认针对已发生的事实，与连接是否还在无关）。
      tags:
        - approvals
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: approvalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: 决策结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/tickets:
    post:
      operationId: issueTicket
      summary: 签发连接票据
      description: |
        为一次远控签发一次性、短时效的连接票据（默认 300 秒，范围 30–900）。
        组织成员均可签发（是否放行由策略决定，不看角色）。

        签发前评估**时段**与**审批要求**：时段外返回 `409 conflict`；策略要求事前
        审批而该 actor 对设备没有已批准且未消费的审批时返回 `409 approval_required`，
        `data.approval_id` 指向新建或复用的待审批请求——审批通过后重试本端点即可。

        **并发上限与时长上限不在这里评估**：签发不产生会话，此刻看不到任何新会话，
        在这里判并发等于恒不超限。并发在兑换时复查（见
        `POST .../tickets/{ticketId}/redeem`），时长是后置处理（超时由后台任务关闭
        会话并告警，不掐断真实连接——面板不在信令链路上）。

        明文 `token` **仅在本次响应中返回一次**，服务端只保存摘要。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCreateRequest"
      responses:
        "201":
          description: 已签发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            策略阻断：`approval_required`（需事前审批，`data.approval_id` 为待审批
            请求）或 `conflict`（时段外等约束不满足）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orgs/{orgId}/alerts:
    get:
      operationId: listAlerts
      summary: 策略违规告警列表
      description: |
        本组织的告警，按 `created_at` 倒序（同秒按 `id` 倒序），分页返回。

        告警来源（对应约束实际生效的位置）：
        - 签发时时段外被拒 → `outside_window`
        - 兑换时并发超限被拒 → `concurrency_exceeded`
        - 后台任务发现会话超过时长上限 → `duration_exceeded`（后置，不掐断连接）
        - 原生直连会话违反时段/时长 → 只告警不阻断（D10）

        事前审批阻断不产生告警（见 Alert.kind）；与 open 会话归并的 panel 日志事件
        也不产生 native 告警（见 Session 生命周期）。
        组织成员即可读取。
      tags:
        - alerts
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AlertSeverity"
        - name: kind
          in: query
          required: false
          description: 告警类型（自由字符串，见 Alert.kind 的已知取值）
          schema:
            type: string
            maxLength: 64
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: sessionId
          in: query
          required: false
          description: |
            只返回该会话引起的告警（`Alert.session_id`）。会话详情页据此展示
            「关联告警」：告警列表按时间倒序分页，客户端自行按 `session_id` 过滤
            会漏掉不在当前页的告警。未知 id 返回空页，不报错；跨组织的 id 同样
            返回空页（租户作用域优先于过滤条件）。
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 告警列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

