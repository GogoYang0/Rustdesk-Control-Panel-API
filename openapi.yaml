      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: q
          in: query
          required: false
          description: 按名称或 rustdesk_id 大小写不敏感子串匹配
          schema:
            type: string
            maxLength: 64
        - name: bound
          in: query
          required: false
          description: 是否已绑定客户端
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
