      responses:
        "200":
          description: 已分配
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/user-groups:
    get:
      operationId: listUserGroups
      summary: 列出用户组
      description: |
        返回组织的用户组，含内置 `everyone`（`kind=everyone`；成员隐式，`member_ids`
        恒为空）。自定义组返回显式成员 id，供 PUT 全量替换回填。需要 `access.manage`。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 用户组列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroupListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUserGroup
      summary: 创建用户组
      description: |
        需要 `access.manage`。名称为去首尾空白后的 1–64 个字符；`everyone` 为保留名
        （不区分大小写），保留名或与已有组重名均返回 409。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGroupCreateRequest"
      responses:
        "201":
          description: 已创建的用户组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/user-groups/{groupId}:
    patch:
      operationId: renameUserGroup
      summary: 重命名用户组
      description: |
        需要 `access.manage`。`everyone` 组不可重命名（409）；名称规则与创建相同。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
