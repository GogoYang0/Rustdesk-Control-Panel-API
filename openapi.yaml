openapi: 3.1.0
info:
  title: Rustdesk-Control-Panel API
  version: 0.9.0
  contact:
    name: Rustdesk-Control-Panel
    url: https://github.com/GogoYang0/Rustdesk-Control-Panel-API
  description: |
    Rustdesk-Control-Panel 控制平面 API。

    本文件是系列唯一契约事实源：WEB 与 APP 的客户端类型由此生成。
    破坏性变更需升主版本（见设计文档 C10）；0.x 阶段破坏性变更以 minor 承载。
    0.3.0 破坏性变更：Invitation.token 不再随响应返回（邀请令牌仅通过邮件投递，
    修复 #17 邮箱所有权缺口）。

    0.4.0 新增**会话治理域**：会话记录（sessions）、连接策略（policies）、
    敏感操作审批（approvals）、连接票据（tickets，挂在 sessions 标签下）与
    策略违规告警（alerts）。既有端点的**请求/响应形状与字段不变**。

    但 `ErrorCode` 新增了 `approval_required`（票据签发被策略的事前审批要求阻断时
    返回，附 `data.approval_id`）——它是所有响应共用的 `code` 类型，**对穷尽式
    `switch` 或严格枚举解码的客户端属于 breaking**。重新生成类型后需要处理该分支
    （0.x 阶段按 C10 以 minor 承载）。
    分页响应本域统一为 `data.items/page/page_size/total`（会话与告警是无限增长的
    历史表，需要总数支撑 UI 翻页；既有列表端点保持原形状）。

    0.5.0 新增**设备管理增量**：`GET /orgs/{orgId}/devices`（分页列表，沿用上述
    页对象形状）与 `POST /orgs/{orgId}/devices/{deviceId}/rebind`（重置绑定：清
    `bound_uuid`、绑定代数 +1、审计留存理由）。`Device` 增加必填字段 `bound`，
    既有端点其余字段不变。**不提供 DELETE**：换机/重装后的绑定恢复用 rebind。

    统一响应包：所有业务响应为 `{code, message, data}`。
    `code` 为机器可读错误码（见 ErrorCode），成功时为 `ok`。

    0.6.0 新增**成员离场**：`DELETE /orgs/{orgId}/members/{userId}` 与
    `PATCH /orgs/{orgId}/members/{userId}`（仅 admin↔member）。两者在变更会籍的
    同一事务内撤销该用户在本组织的活跃 compat 会话（#39）；撤销失败整体回滚。

    0.7.0 新增**按组织 provisioning 开关**：`GET/PUT /orgs/{orgId}/provisioning`
    （仅 owner）。关闭会同步下线容器、释放端口并在同一事务写审计；开启只清除
    标记，部署由供应队列异步执行。状态取值为
    `disabled|pending|provisioning|deployed|failed`；`cleanup_pending` 区分
    “关闭意图已记录”与“容器清理已完成”。

    0.8.0 新增**角色模型**：权限判定改为 `memberships.role_id → roles.permissions`，
    owner/admin/member 变为内置角色行，组织可创建自定义角色并授予。
    新增 `GET /permissions` 权限目录与 `/orgs/{orgId}/roles` 系列端点；
    `Member` 增加 `role_id`、`role_name`、`disabled`，`role` 不再限定为内置三种
    （自定义角色名会出现在该字段，等价于 `role_name`）。`PATCH members` 请求体
    改为按字段的 `MemberUpdateRequest`（`role_id` / `disabled`）。

    0.9.0 新增**访问控制域**（对齐 RustDesk Server Pro Access Control，只做准入，
    不含会话内 Control Role）：用户组、设备组与只有 allow 的组规则。
    `Device` 增加 `device_group_id`（null 表示未分组；一台设备只能属于一个
    设备组）。普通成员的 `GET /api/peers` 只返回规则允许的设备，票据签发与
    兑换按同一判定拒绝（返回 404，不泄露设备存在性）。`Permission` 新增
    `access.manage`（owner 拥有；admin 由内置集合授予；不可委派）。
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: system
    description: 运维与自检接口
  - name: auth
    description: 认证与令牌
  - name: orgs
    description: 组织与成员
  - name: devices
    description: 设备与心跳
  - name: addressbooks
    description: 地址簿（个人/共享）
  - name: logs
    description: 采集日志查询
  - name: sessions
    description: 会话记录（面板签发与日志推断）与连接票据
  - name: policies
    description: 连接策略（并发、时长、时段、事前审批）
  - name: approvals
    description: 敏感操作审批（事前阻断与事后追认）
  - name: alerts
    description: 策略违规告警
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 存活探针
      description: 返回进程存活状态，不需要认证。
      tags:
        - system
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok

  /api/v1/auth/login:
    post:
      operationId: login
      summary: 邮箱密码登录
      description: 校验邮箱与密码，返回 access/refresh 令牌对。受 IP 与账号双轨限流（429）。邮箱未验证的账号返回 403（code=email_not_verified）。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      summary: 轮换 refresh 令牌
      description: |
        校验 refresh 令牌并轮换：旧令牌立即撤销，返回新的令牌对。
        重放已撤销令牌会撤销该用户全部 refresh 令牌，需重新登录。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 轮换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/tokens:
    get:
      operationId: listTokens
      summary: 列出个人访问令牌
      description: |
        返回当前用户在某组织内的个人令牌（v0.8.0，不返回明文）。需要 JWT 身份
        （个人令牌本身不能管理令牌）。
      tags:
        - auth
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 令牌列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createToken
      summary: 创建个人访问令牌
      description: |
        签发一个绑定到单个组织的个人令牌（v0.8.0）。明文只在创建响应中出现一次；
        服务端只存 SHA-256。`permissions` 省略时取当前角色的全部权限，给出时必须是
        当前角色权限的子集（不能借令牌提权）。每人每组织最多 20 个活跃令牌。
        有效期 `expires_in_days` 1..365，默认 90。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreateRequest"
      responses:
        "201":
          description: 已创建（含一次性明文）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedAPITokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/tokens/{tokenId}:
    delete:
      operationId: revokeToken
      summary: 撤销个人访问令牌
      description: 撤销当前用户名下的一个个人令牌（v0.8.0）；重复撤销幂等，他人令牌返回 404。
      tags:
        - auth
      security:
        - bearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/2fa/setup:
    post:
      operationId: setupTOTP
      summary: 初始化 TOTP 两步验证
      description: |
        生成新的 TOTP 秘密并返回 `otpauth://` URI（v0.8.0）。秘密在用户完成
        `/auth/2fa/enable` 之前不生效；已启用时再次调用返回 409。
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 秘密与 provisioning URI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/2fa/enable:
    post:
      operationId: enableTOTP
      summary: 启用 TOTP 两步验证
      description: 校验首个 TOTP 码后启用（v0.8.0）。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: 已启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/2fa/disable:
    post:
      operationId: disableTOTP
      summary: 关闭 TOTP 两步验证
      description: 需要当前密码 + 一个有效的 TOTP 码或恢复码（v0.8.0）。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPDisableRequest"
      responses:
        "200":
          description: 已关闭
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/2fa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: 重新生成恢复码
      description: 需要当前密码 + 有效 TOTP 码或恢复码；返回 10 个一次性恢复码（只出现一次，v0.8.0）。
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPDisableRequest"
      responses:
        "200":
          description: 新的恢复码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPRecoveryCodesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/2fa/verify:
    post:
      operationId: verifyTOTP
      summary: 登录第二步校验
      description: |
        使用登录返回的短期 `challenge_token` 与 TOTP 码（或一次性恢复码）完成登录
        （v0.8.0）。成功返回与 `/auth/login` 相同的令牌对。

        挑战令牌本身不是一次性凭据：它在签发后 5 分钟内有效，期间可重复提交校验。
        一次性的是凭据——每个 TOTP 码仅在对应时间步内可用（同一时间步不可重放），
        每个恢复码只能成功使用一次。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPVerifyRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/orgs:
    get:
      operationId: listOrgs
      summary: 列出当前用户所属组织
      description: 返回调用者已加入的全部组织，按组织 id 升序。
      tags:
        - orgs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 组织列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrg
      summary: 创建组织
      description: 创建组织并将调用者设为 owner。
      tags:
        - orgs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/members:
    get:
      operationId: listMembers
      summary: 列出组织成员
      description: 返回指定组织的成员及其组织内角色；调用者必须是该组织成员。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 成员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/members/{userId}:
    delete:
      operationId: removeMember
      summary: 移除组织成员
      description: |
        移除成员并在**同一事务**内撤销该用户在本组织的全部活跃 compat 会话
        （#39 offboarding）。需要 member.manage 权限；admin 不能移除 owner，
        最后一个 owner 不能被移除，不能通过本端点移除自己。撤销失败则整体回滚。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已移除，返回被撤销的会话数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      operationId: updateMemberRole
      summary: 更新成员角色或停用状态
      description: |
        按字段更新会籍：`role_id` 授予内置 admin/member 或自定义角色（仅 owner，
        不能授予 owner），`disabled` 停用或恢复会籍（`member.manage`）。两个字段可
        同时出现，需同时满足各自权限。降级角色或停用会在同一事务内撤销该用户在本
        组织的活跃 compat 会话；恢复与提升不撤销。不能变更自己的角色或停用自己，
        也不能停用末位 owner。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdateRequest"
      responses:
        "200":
          description: 更新后的成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/members/{userId}/2fa/reset:
    post:
      operationId: resetMemberTOTP
      summary: 重置成员的 2FA
      description: |
        管理员重置成员的 TOTP 配置（v0.8.0，`member.manage`），使该用户下次登录
        不再要求第二步，并写审计 `user.2fa.reset`。用于用户丢失设备与恢复码的场景。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已重置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/permissions:
    get:
      operationId: listPermissions
      summary: 列出权限目录
      description: |
        返回全部权限码、说明与是否可委派。任何已认证用户可读；自定义角色只能包含
        `delegable=true` 的权限码。
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 权限目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/orgs/{orgId}/roles:
    get:
      operationId: listRoles
      summary: 列出组织角色
      description: 返回内置角色与自定义角色；调用者必须是该组织成员。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRole
      summary: 创建自定义角色
      description: |
        仅 owner（`role.manage`）。权限码必须来自权限目录；包含不可委派权限码返回
        403。名称不能与内置角色（owner/admin/member）或其他角色重名，重名返回 409。
        内置角色不可创建或修改。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreateRequest"
      responses:
        "201":
          description: 已创建的角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
