  /api/v1/orgs/{orgId}/audit-retention:
    get:
      operationId: getAuditRetention
      summary: 查询审计保留期
      description: |
        返回组织的审计保留天数（v0.8.0，仅 owner `org.admin`）。0 = 永久保留。
        响应含最近一次归档的状态。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 保留期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRetentionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setAuditRetention
      summary: 设置审计保留期
      description: |
        设置组织的审计保留天数（v0.8.0，仅 owner `org.admin`）；0 = 永久保留，
        1..3650 为正的保留窗口。到期记录由后台任务先归档到本地文件校验后再删除；
        归档失败则该组织本轮不删除。设置动作写审计 `organization.audit_retention.set`。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditRetentionRequest"
      responses:
        "200":
          description: 更新后的保留期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRetentionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/provisioning:
    get:
      operationId: getProvisioning
      summary: 查询组织 provisioning 状态
      description: |
        返回供应开关与部署状态。仅 owner（org.admin）可读。
        `state` 为 `disabled|pending|provisioning|deployed|failed`。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 当前状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      operationId: updateProvisioning
      summary: 启用或禁用组织 provisioning
      description: |
        仅 owner。`enabled=false` 会同步下线已有容器、删除 `ServerGroup` 行，并在
        同一事务内置标记与写审计；`enabled=true` 只清除标记，部署由供应队列异步
        执行（队列满时由 reconciler 兜底）。状态未变化时为幂等 no-op。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisioningUpdateRequest"
      responses:
        "200":
          description: 更新后的状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

