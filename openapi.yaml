      operationId: listMembers
      summary: 列出组织成员
      description: 返回指定组织的成员及其组织内角色；调用者必须是该组织成员。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 成员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/members/{userId}:
    delete:
      operationId: removeMember
      summary: 移除组织成员
      description: |
        移除成员并在**同一事务**内撤销该用户在本组织的全部活跃 compat 会话
        （#39 offboarding）。需要 member.manage 权限；admin 不能移除 owner，
        最后一个 owner 不能被移除，不能通过本端点移除自己。撤销失败则整体回滚。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已移除，返回被撤销的会话数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    patch:
      operationId: updateMemberRole
      summary: 更新成员角色或停用状态
      description: |
        按字段更新会籍：`role_id` 授予内置 admin/member 或自定义角色（仅 owner，
        不能授予 owner），`disabled` 停用或恢复会籍（`member.manage`）。两个字段可
        同时出现，需同时满足各自权限。降级角色或停用会在同一事务内撤销该用户在本
        组织的活跃 compat 会话；恢复与提升不撤销。不能变更自己的角色或停用自己，
        也不能停用末位 owner。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdateRequest"
      responses:
        "200":
          description: 更新后的成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/members/{userId}/passkeys/reset:
    post:
      operationId: resetMemberPasskeys
      summary: 重置成员的 passkey
      description: |
        管理员清空成员的 WebAuthn 凭据（`member.manage`），写审计 `user.passkey.reset`。
        守卫与 `2fa/reset` 一致：不能重置自己；重置 owner 需要 `org.admin`；
        目标同属其他组织时拒绝（账户级因子不能由单租户管理员处置）；事务内复判。

        额外一条：目标账户**没有密码**时返回 409 —— 清空凭据会让它彻底无法登录。
        用于用户丢失认证器但仍有密码的场景。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已重置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          description: passkey 未启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orgs/{orgId}/members/{userId}/2fa/reset:
    post:
      operationId: resetMemberTOTP
      summary: 重置成员的 2FA
      description: |
        管理员重置成员的 TOTP 配置（v0.8.0，`member.manage`），使该用户下次登录
        不再要求第二步，并写审计 `user.2fa.reset`。用于用户丢失设备与恢复码的场景。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已重置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

