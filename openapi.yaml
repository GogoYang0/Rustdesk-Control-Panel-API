  /api/v1/orgs/{orgId}/provisioning:
    get:
      operationId: getProvisioning
      summary: 查询组织 provisioning 状态
      description: |
        返回供应开关与部署状态。仅 owner（org.admin）可读。
        `state` 为 `disabled|pending|provisioning|deployed|failed`。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 当前状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      operationId: updateProvisioning
      summary: 启用或禁用组织 provisioning
      description: |
        仅 owner。`enabled=false` 会同步下线已有容器、删除 `ServerGroup` 行，并在
        同一事务内置标记与写审计；`enabled=true` 只清除标记，部署由供应队列异步
        执行（队列满时由 reconciler 兜底）。状态未变化时为幂等 no-op。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisioningUpdateRequest"
      responses:
        "200":
          description: 更新后的状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs/{orgId}/invitations:
    post:
      operationId: createInvitation
      summary: 邀请成员加入组织
      description: 生成邀请令牌（服务端只存哈希），有效期 7 天，并通过邮件发送给受邀邮箱；令牌不出现在响应中（issue #17）。需要 member.manage 权限。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
      responses:
        "201":
          description: 邀请已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: 接受邀请
      description: 使用邀请令牌加入组织；令牌过期或已使用返回 409。
      tags:
