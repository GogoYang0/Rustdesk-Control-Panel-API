        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Policy"

    ApprovalKind:
      type: string
      description: |
        - pre_approval：事前审批——为**将要发起**的连接放行一次票据签发
        - ratification：事后追认——对**已发生**的原生直连违规会话（日志推断）做确认，
          不产生票据
      enum:
        - pre_approval
        - ratification

    ApprovalStatus:
      type: string
      description: |
        - pending：待审批
        - approved：已批准。`kind=pre_approval` 时可被**一次**票据签发消费；
          `kind=ratification` 时表示「已追认」，不可消费、不产生票据
        - denied：已拒绝
        - expired：超期未决策（后台任务标记）
      enum:
        - pending
        - approved
        - denied
        - expired

    Approval:
      type: object
      required:
        - id
        - organization_id
        - device_id
        - kind
        - status
        - requested_at
        - expires_at
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/ApprovalKind"
        session_id:
          type:
            - integer
            - "null"
          format: int64
          description: 事后追认关联的会话（`kind=ratification`）；事前审批为 null
        actor_user_id:
          type: integer
          format: int64
          description: 发起审批的成员
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 待审批请求的有效期；超期由后台任务置为 expired
        decided_by:
          type:
            - integer
            - "null"
          format: int64
          description: 决策人（owner/admin）
        decided_at:
          type:
            - string
            - "null"
          format: date-time
        reason:
          type:
            - string
            - "null"
          maxLength: 500
          description: 申请理由或拒绝理由
        ticket_id:
          type:
            - integer
            - "null"
          format: int64
          description: 批准后被消费签发的票据（一次性绑定）

    ApprovalResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Approval"

    ApprovalListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/ApprovalPage"

    ApprovalCreateRequest:
      type: object
      description: |
        提交审批请求，按 `kind` 二选一：

        - `pre_approval`：必须提供 `device_id`
        - `ratification`（事后追认）：必须提供 `session_id`，且该会话必须属于本组织、
          `origin=native`（面板会话本身已受策略管控，无需追认）；`device_id` 由服务端
          从会话派生

        两者都给、都不给，或 `kind` 与字段不匹配，返回 `400 invalid_request`。
        同一 actor + 设备已有 `pending` 的事前审批时**复用**该请求（返回 200）；
        同一会话已有 `pending`/`approved` 的追认时同样复用，不重复创建。
      required:
        - kind
      properties:
        kind:
          $ref: "#/components/schemas/ApprovalKind"
        device_id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        reason:
          type: string
          maxLength: 500

    ApprovalDecision:
      type: string
      description: |
        - approve：批准（pre_approval 放行一次签发；ratification 即「已追认」）
        - deny：拒绝
      enum:
        - approve
        - deny

    ApprovalDecisionRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          $ref: "#/components/schemas/ApprovalDecision"
        reason:
          type: string
          maxLength: 500

