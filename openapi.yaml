            format: int64
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/policies:
    get:
      operationId: listPolicies
      summary: 连接策略列表
      description: |
        本组织的连接策略（单次返回全部，不分页）。组织成员即可读取。

        评估票据签发时**所有 `enabled` 策略同时生效**，各维度取最严约束
        （并发/时长的最小值、时段的交集、任一条要求审批即需审批）。时段按模 1440
        求交（跨零点窗口先展开成区间再取交），**交集为空表示该时段完全禁止**。
      tags:
        - policies
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 策略列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPolicy
      summary: 创建连接策略
      description: |
        需要 `owner`/`admin` 角色。创建即生效（`enabled` 由请求体显式给出）。
        同一组织内策略 `name` 唯一，重复创建返回 `409 conflict`。
      tags:
        - policies
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/policies/{policyId}:
    put:
      operationId: updatePolicy
      summary: 更新连接策略
      description: |
        全量更新策略：`enabled`/`require_approval` 必填，限额字段为 null 表示「不限」。
        需要 `owner`/`admin` 角色。改名撞上同组织内其他策略返回 `409 conflict`。
      tags:
        - policies
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: policyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deletePolicy
      summary: 删除连接策略
      description: 删除后该策略不再参与评估；已签发的票据保留签发时的策略快照。需要 `owner`/`admin` 角色。
      tags:
        - policies
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: policyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/approvals:
    get:
      operationId: listApprovals
      summary: 审批请求列表
      description: |
        本组织的审批请求，按 `requested_at` 倒序（同秒按 `id` 倒序），分页返回。审批中心按
        `status=pending` 拉取待办。组织成员即可读取（审批中心对 member 只读）。
      tags:
        - approvals
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
        - name: deviceId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 审批请求列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createApproval
      summary: 提交审批请求
      description: |
        为指定设备提交事前审批请求（默认 15 分钟有效）。组织成员均可提交；
        组织无需审批时也可提交，但票据签发并不依赖它——是否需要审批由策略决定。

        复用规则按 `kind` 区分，两种都不重复创建：

        - `pre_approval`：同一 actor + 设备已有 `pending` 请求 → 复用，返回 200
        - `ratification`：同一会话已有 `pending` 或 `approved` 的追认 → 复用，返回 200
          （同一会话被不同 approver 重复点开时不应该产生多条待办）

        首次创建返回 201。
      tags:
        - approvals
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCreateRequest"
      responses:
        "201":
          description: 已创建待审批请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "200":
          description: 复用既有待审批请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      summary: 审批决定（approve/deny）
      description: |
        需要 `owner`/`admin` 角色。只有 `pending` 请求可决策；已决策或已过期返回
        `409 conflict`。

        - `kind=pre_approval`：`approve` 后该 actor 对该设备的**下一次**票据签发不再
          被审批阻断。审批本身不签发任何东西（不返回 token）——客户端重试
          `POST .../tickets` 才拿到票据，审批与票据**一次性绑定**（签发票据即消费审批）。

          消费点在签发而不是兑换：票据过期（默认 300 秒）**不退还审批**，需要重新申请。
          这样"一次审批 = 一次签发许可"的语义最简单，也不会因为客户端反复兑换失败
          而重复消耗审批。
        - `kind=ratification`：`approve` 即「已追认」，仅改状态并落审计，
          不产生票据、不消费任何额度（`ticket_id` 恒为 null）。

        `expires_at` 对两类一致：请求时刻 + 15 分钟；超期未决策由后台任务置 `expired`。
        已结束的原生会话同样可以追认（追认针对已发生的事实，与连接是否还在无关）。
      tags:
        - approvals
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: approvalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: 决策结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/tickets:
    post:
      operationId: issueTicket
      summary: 签发连接票据
      description: |
        为一次远控签发一次性、短时效的连接票据（默认 300 秒，范围 30–900）。
        组织成员均可签发（是否放行由策略决定，不看角色）。

        签发前评估**时段**与**审批要求**：时段外返回 `409 conflict`；策略要求事前
        审批而该 actor 对设备没有已批准且未消费的审批时返回 `409 approval_required`，
        `data.approval_id` 指向新建或复用的待审批请求——审批通过后重试本端点即可。

        **并发上限与时长上限不在这里评估**：签发不产生会话，此刻看不到任何新会话，
        在这里判并发等于恒不超限。并发在兑换时复查（见
        `POST .../tickets/{ticketId}/redeem`），时长是后置处理（超时由后台任务关闭
        会话并告警，不掐断真实连接——面板不在信令链路上）。

        明文 `token` **仅在本次响应中返回一次**，服务端只保存摘要。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCreateRequest"
      responses:
        "201":
          description: 已签发
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedTicketResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            策略阻断：`approval_required`（需事前审批，`data.approval_id` 为待审批
            请求）或 `conflict`（时段外等约束不满足）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orgs/{orgId}/alerts:
    get:
      operationId: listAlerts
      summary: 策略违规告警列表
      description: |
        本组织的告警，按 `created_at` 倒序（同秒按 `id` 倒序），分页返回。

        告警来源（对应约束实际生效的位置）：
        - 签发时时段外被拒 → `outside_window`
        - 兑换时并发超限被拒 → `concurrency_exceeded`
        - 后台任务发现会话超过时长上限 → `duration_exceeded`（后置，不掐断连接）
        - 原生直连会话违反时段/时长 → 只告警不阻断（D10）

        事前审批阻断不产生告警（见 Alert.kind）；与 open 会话归并的 panel 日志事件
        也不产生 native 告警（见 Session 生命周期）。
        组织成员即可读取。
      tags:
        - alerts
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AlertSeverity"
        - name: kind
          in: query
          required: false
          description: 告警类型（自由字符串，见 Alert.kind 的已知取值）
          schema:
            type: string
            maxLength: 64
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 告警列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/approvals/{approvalId}:
    get:
      operationId: getApproval
      summary: 审批请求详情
      description: 单个审批请求（审批中心深链）。组织成员即可读取。
      tags:
        - approvals
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: approvalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 审批请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/tickets/{ticketId}:
    get:
      operationId: getTicket
      summary: 票据详情
      description: |
        票据的记账状态（是否已兑换、过期、撤销）。明文 token **不会**返回。
        组织成员即可读取。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 票据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/tickets/{ticketId}/redeem:
    post:
      operationId: redeemTicket
      summary: 兑换连接票据（创建面板会话）
      description: |
        兑换一次性票据：在**同一个事务**里复查并发与时段 → 原子占用 `used_at` →
        创建一条 `origin=panel`、`status=open` 的会话（`started_at` 为兑换时刻），
        返回该会话。这是 open panel 会话的唯一创建入口，也是并发配额的真正闸门。

        **并发复查必须在兑换时做**：统计本组织 `status=open` 且 `origin=panel` 的会话数，
        达到策略上限就拒绝——否则「先连签 N 张票据再并行兑换」可以绕过并发上限。

        ⚠️ 只把计数与插入放进同一事务**不够**：在默认的 READ COMMITTED 隔离级别下，
        两个事务可以各自读到旧计数、各自通过检查、各自插入，上限照样被突破。
        必须显式串行化同一组织的兑换：**先 `SELECT ... FOR UPDATE` 锁住组织行
        （或该组织的策略行），再做计数与插入**。

        不要用「按设备」的唯一约束来代替：上限是按**组织**统计的，设备级约束既拦不住
        不同设备同时占满名额（上限=1 时两台设备照样各自通过），又会错误拒绝同一设备的
        第二个合法会话（上限>1 时）。串行化范围只需到组织粒度，跨组织的兑换互不影响。
        SQLite 上写事务本身串行，但实现不得因此省掉锁——生产是 MySQL/PostgreSQL。

        票据只能兑换一次：已兑换、已过期、已撤销或 token 不匹配一律返回
        `409 conflict`（不区分原因，避免探测）；并发或时段约束不满足同样返回 409
        （`conflict`，原因写在 message 里）。票据不存在或不属于本组织返回 404。
        组织成员即可兑换（M4 托管客户端若需未登录兑换，走面板内部路径，不在本契约内）。

        M3 阶段票据不注入信令（面板不在信令链路），这里是面板侧记账入口；
        网页客户端托管与票据注入见 M4。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketRedeemRequest"
      responses:
        "201":
          description: 已兑换，返回新建的会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            票据已兑换、已过期、已撤销、token 不匹配，或并发/时段约束不满足
            （统一 `conflict`，message 说明具体原因）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未认证或令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 状态冲突（重复、过期或已使用）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: 触发限流
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Internal:
      description: 服务端错误（如邀请邮件投递失败）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorCode:
      type: string
      description: |
        机器可读错误码：
        - ok：成功
        - invalid_request：参数校验失败
        - unauthorized：未认证或令牌无效
        - forbidden：权限不足
        - not_found：资源不存在
        - conflict：状态冲突（重复创建、邀请过期或已使用、验证令牌无效）
        - rate_limited：触发限流
        - internal：服务端错误
        - email_not_verified：邮箱未验证（登录被拒）
        - approval_required：票据签发被策略的事前审批要求阻断（409，`data.approval_id` 为待审批请求）
      enum:
        - ok
        - invalid_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
        - internal
        - email_not_verified
        - approval_required
        - two_factor_required

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type:
            - object
            - "null"
          additionalProperties: true
          description: |
            错误上下文；多数错误为 null。`code=approval_required` 时带
            `approval_id`（int64，待审批请求 id），客户端据此跳转审批中心。
            `code=two_factor_required` 时带 `challenge_token`（短期挑战令牌），
            客户端用它调用 `POST /auth/2fa/verify` 完成第二步登录。

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 16

    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
          description: access 令牌剩余有效秒数

    TokenResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/TokenPair"

    APIToken:
      type: object
      required:
        - id
        - organization_id
        - name
        - token_prefix
        - permissions
        - expires_at
        - created_at
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        name:
          type: string
        token_prefix:
          type: string
          description: 令牌前 8 个字符，用于列表辨识（不足以重放）
        permissions:
          type: array
          items:
            type: string
          description: 申请时的权限子集；有效权限还要与该用户当前角色取交集
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time

    IssuedAPIToken:
      type: object
      required:
        - token
        - plaintext
      properties:
        token:
          $ref: "#/components/schemas/APIToken"
        plaintext:
          type: string
          description: 明文令牌，只在本响应出现一次，服务端不保存

    APITokenListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"

    IssuedAPITokenResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/IssuedAPIToken"

    TokenCreateRequest:
      type: object
      required:
        - name
        - organization_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: 用户可读标签
        organization_id:
          type: integer
          format: int64
          description: 令牌绑定的组织；请求必须来自该组织的有效会籍
        permissions:
          type: array
          items:
            type: string
          description: 省略时取当前角色的全部权限；给出时必须是当前角色权限的子集
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90

    TOTPSetup:
      type: object
      required:
        - secret
        - otpauth_uri
      properties:
        secret:
          type: string
          description: Base32 编码的 TOTP 秘密（尚未启用）
        otpauth_uri:
          type: string
          description: 供验证器 App 扫码/导入的 `otpauth://totp/...` URI

    TOTPSetupResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/TOTPSetup"

    TOTPCodeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 10
          description: 6 位 TOTP 码或恢复码

    TOTPDisableRequest:
      type: object
      required:
        - password
        - code
      properties:
        password:
          type: string
        code:
          type: string
          description: TOTP 码或一次性恢复码

    TOTPRecoveryCodes:
      type: object
      required:
        - codes
      properties:
        codes:
          type: array
          items:
            type: string
          description: 10 个一次性恢复码，只在本响应出现一次

    TOTPRecoveryCodesResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/TOTPRecoveryCodes"

    TOTPVerifyRequest:
      type: object
      required:
        - challenge_token
        - code
      properties:
        challenge_token:
          type: string
        code:
          type: string
          description: TOTP 码或一次性恢复码

    Org:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 128
        created_at:
          type: string
          format: date-time

    OrgCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128

    OrgResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Org"

    OrgListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Org"

    Member:
      type: object
      required:
        - id
        - user_id
        - email
        - role
        - role_id
        - role_name
        - disabled
        - created_at
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          description: 兼容字段，等同于 `role_name`；自定义角色名不限于内置三种
        role_id:
          type: integer
          format: int64
          description: 会籍引用的角色 id（`memberships.role_id`）
        role_name:
          type: string
          description: 角色展示名（内置 owner/admin/member 或自定义名称）
        disabled:
          type: boolean
          description: 会籍是否已停用；停用后不能登录或访问该组织
        created_at:
          type: string
          format: date-time

    MemberResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Member"

    MemberListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    MemberUpdateRequest:
      type: object
      minProperties: 1
      description: |
        按字段更新会籍，至少给出 `role_id` 或 `disabled` 之一。
        - `role_id`：授予本组织内的内置 admin/member 或自定义角色（不能授予 owner）；
          需要 `org.admin`（仅 owner）。
        - `disabled`：停用或恢复会籍；需要 `member.manage`。不能停用自己或末位 owner；
          停用会在同一事务内撤销该用户在本组织的活跃 compat 会话。
      properties:
        role_id:
          type: integer
          format: int64
          description: 目标角色 id；owner 角色不可通过本端点授予
        disabled:
          type: boolean
          description: true 停用，false 恢复

    MemberMutation:
      type: object
      required:
        - revoked_sessions
      properties:
        revoked_sessions:
          type: integer
          format: int64
          description: 本次撤销的活跃 compat 会话数

    MemberMutationResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/MemberMutation"

    Permission:
      type: object
      required:
        - code
        - description
        - delegable
      properties:
        code:
          type: string
          description: 权限码，如 `member.manage`
        description:
          type: string
        delegable:
          type: boolean
          description: 自定义角色是否可以包含该权限码；false 为 owner 专属

    PermissionListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    RoleAuditScope:
      type: string
      description: |
        审计可见范围：`global` 可查全组织审计；`individual` 只查自己作为操作者
        或目标（用户类目标）的条目。仅对持有 `audit.read` 的角色有意义。
      enum:
        - global
        - individual

    RoleKind:
      type: string
      description: |
        - owner/admin/member：内置角色，权限集固定，不可修改或删除
        - custom：组织自建角色，权限只能是目录中 `delegable=true` 的子集
      enum:
        - owner
        - admin
        - member
        - custom

    Role:
      type: object
      required:
        - id
        - name
        - kind
        - permissions
        - audit_scope
        - builtin
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          $ref: "#/components/schemas/RoleKind"
        permissions:
          type: array
          items:
            type: string
          description: 角色持有的权限码集合
        audit_scope:
          $ref: "#/components/schemas/RoleAuditScope"
        builtin:
          type: boolean
          description: true 表示内置角色（不可编辑/删除/授予 owner）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RoleCreateRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 自定义角色名；不能与内置角色或已有角色重名
        permissions:
          type: array
          items:
            type: string
          description: 权限码子集；必须全部来自权限目录且 `delegable=true`
        audit_scope:
          $ref: "#/components/schemas/RoleAuditScope"
          description: 省略时默认 `individual`

    RoleUpdateRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          type: array
          items:
            type: string
        audit_scope:
          $ref: "#/components/schemas/RoleAuditScope"

    RoleResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Role"

    RoleListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    UserGroupKind:
      type: string
      description: |
        - everyone：每个组织唯一的保留组，成员隐式（全部组织成员），不可改名/删除，
          成员集合不可编辑
        - custom：组织自建组，成员由管理面显式维护
      enum:
        - everyone
        - custom

    UserGroup:
      type: object
      required:
