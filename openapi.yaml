        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/AddressBook"

    LogEvent:
      type: object
      required:
        - id
        - source
        - level
        - kind
        - occurred_at
      properties:
        id:
          type: integer
          format: int64
        device_id:
          type:
            - integer
            - "null"
          format: int64
          description: 关联设备；无法解析时为 null
        source:
          type: string
          enum:
            - hbbs
            - hbbr
        level:
          type: string
          enum:
            - info
            - warn
            - error
        kind:
          type: string
          enum:
            - conn
            - file
            - error
            - other
        detail:
          type:
            - object
            - "null"
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time

    LogEventListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/LogEvent"
