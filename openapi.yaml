            format: int64
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已删除，返回级联删除的规则数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroupDeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/user-groups/{groupId}/members:
    put:
      operationId: replaceUserGroupMembers
      summary: 全量替换用户组成员
      description: |
        需要 `access.manage`。请求中的用户必须全部是本组织成员，任一越界或不存在的
        id 都整单拒绝（400），不静默跳过。`everyone` 组成员不可编辑（409）。提交与
        现状相同的集合不产生变更（added=removed=0）。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGroupMembersRequest"
      responses:
        "200":
          description: 已替换，返回新增与移除数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroupMembersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/device-groups:
    get:
      operationId: listDeviceGroups
