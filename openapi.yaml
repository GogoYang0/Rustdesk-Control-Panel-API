      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128

    AddressBookPeer:
      type: object
      required:
        - peer_id
      properties:
        peer_id:
          type: string
          minLength: 1
          maxLength: 64
          description: RustDesk 设备 ID
        alias:
          type: string
          maxLength: 128
        username:
          type: string
          maxLength: 128
        hostname:
          type: string
          maxLength: 128
        platform:
          type: string
          maxLength: 64
        tags:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 64

    AddressBookTag:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: RGB 颜色值（同 RustDesk 客户端 tag_colors 语义）

    AddressBook:
      type: object
      required:
        - id
        - name
        - scope
        - revision
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 128
        scope:
          type: string
          enum:
            - personal
            - shared
        owner_id:
          type:
            - integer
            - "null"
          format: int64
          description: personal 时为所有者用户 id；shared 时为 null
        revision:
          type: integer
          format: int64
          description: 内容修订号，每次 peers/tags 全量替换递增
        peers:
          type: array
          items:
            $ref: "#/components/schemas/AddressBookPeer"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/AddressBookTag"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AddressBookPeersReplaceRequest:
      type: object
      required:
        - peers
      properties:
        peers:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/AddressBookPeer"

    AddressBookTagsReplaceRequest:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/AddressBookTag"

    AddressBookResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/AddressBook"

    AddressBookListResponse:
      type: object
      required:
        - code
