        - cleanup_pending
      properties:
        enabled:
          type: boolean
        state:
          type: string
          enum:
            - disabled
            - pending
            - provisioning
            - deployed
            - failed
        cleanup_pending:
          type: boolean
          description: |
            `enabled=false` 时是否仍有待清理的部署行（teardown 未确认）。
            true 表示开关已关但容器清理仍待完成（在途部署回滚或重复关闭重试）；
            false 表示没有遗留部署行。其他状态下恒为 false。

