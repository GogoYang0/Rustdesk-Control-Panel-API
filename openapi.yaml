        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/devices/{deviceId}/rebind:
    post:
      operationId: resetDeviceBinding
      summary: 重置设备绑定
      description: |
        清空设备的 `bound_uuid` 并把 `binding_generation` +1，使此前登录取到该设备
        的 compat 会话立即失去驱动设备的能力（其心跳与系统信息被丢弃）。`reason`
        必填并随审计一同留存。需要 device.write 权限。

        重复调用是安全的：每次都成功且代数继续 +1，不会把系统带进半个状态。
        设备不属于本组织与设备不存在都返回 404。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRebindRequest"
      responses:
        "200":
          description: 重置后的设备（`bound=false`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/devices/{deviceId}:
    patch:
      operationId: setDeviceDisabled
      summary: 停用或恢复设备
      description: |
        停用设备（v0.8.0，`device.write`）：拒绝该设备的新客户端认领、compat 登录、
        心跳与系统信息上报，并在同一事务撤销该设备在本组织的活跃 compat 会话；
        票据兑换被拒绝（409）。恢复后设备重新可被认领与连接。设备历史（心跳、会话、
        审计）保留。重复设置同一状态为 200 no-op。设备不属于本组织或不存在返回 404。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceDisableRequest"
      responses:
        "200":
          description: 更新后的设备
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/sessions:
    get:
      operationId: listSessions
      summary: 会话记录列表
      description: |
        本组织的会话记录，按 `started_at` 倒序（同秒按 `id` 倒序，保证翻页稳定），
        分页返回。组织成员即可读取。

        `origin` 区分两类来源：`panel`（面板签发：网页客户端与地址簿下发的连接
        票据，策略强制且可事前阻断）与 `native`（原生客户端直连，由 hbbs/hbbr
        日志采集推断，只记录不阻断）。`denied` 状态的会话只出现在 `panel` 来源，
        表示签发阶段即被策略拒绝，用于留痕。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: origin
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionOrigin"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionStatus"
        - name: deviceId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: since
          in: query
          required: false
          description: 起始时间（含），按 `started_at` 过滤
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: 结束时间（含），按 `started_at` 过滤
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: 会话详情（含事件序列）
      description: |
        返回单个会话及其事件序列（`started`/`approved`/`denied`/`closed` 等，
        按时间正序）。事件序列是审计留痕：超过 200 条时只返回最早 200 条并置
        `truncated=true`。组织成员即可读取。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
