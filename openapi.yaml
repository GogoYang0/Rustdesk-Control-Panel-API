  /api/v1/orgs/{orgId}/devices/{deviceId}/heartbeat:
    post:
      operationId: deviceHeartbeat
      summary: 设备心跳
      description: |
        上报设备在线心跳，刷新 last_seen_at。需要 device.write 权限。
        设备已停用时返回 409（停用设备的活跃提示不再可信，也不会刷新时间）。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 心跳已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/devices/{deviceId}/rebind:
    post:
      operationId: resetDeviceBinding
      summary: 重置设备绑定
      description: |
        清空设备的 `bound_uuid` 并把 `binding_generation` +1，使此前登录取到该设备
        的 compat 会话立即失去驱动设备的能力（其心跳与系统信息被丢弃）。`reason`
        必填并随审计一同留存。需要 device.write 权限。

        重复调用是安全的：每次都成功且代数继续 +1，不会把系统带进半个状态。
        设备不属于本组织与设备不存在都返回 404。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRebindRequest"
      responses:
        "200":
          description: 重置后的设备（`bound=false`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/devices/{deviceId}/disconnect:
    post:
      operationId: requestDeviceDisconnect
      summary: 请求断开设备的当前连接
      description: |
        需要 `device.disconnect`（owner 全量、admin 由内置集合授予，不可委派）。
        `reason` 必填（去首尾空白后 1–255 字符），随审计留存。

        **面板不直接断连**：它不在信令链路（设计 D10）。本端点只记录一次请求，
        由客户端下一次 `POST /api/heartbeat` 的响应 `disconnect` 字段执行——
        客户端把请求里自报的**活跃连接编号**断开。因此：

        - 生效延迟最长一个心跳周期（30 秒）加上客户端处理时间；
        - 客户端当时没有活跃连接（`conns` 为空）时请求**保持 pending**，不消耗；
        - 同一设备已有 pending 请求时返回 `409`（避免堆积重复断连）；
        - 15 分钟未被消费则标记 `expired` 并写系统审计。

        设备不存在或不属于本组织均返回 `404`。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceDisconnectRequest"
      responses:
        "201":
          description: 已记录的断连请求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDisconnectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/devices/{deviceId}/strategy:
    put:
      operationId: assignDeviceStrategy
      summary: 分配设备的客户端策略
      description: |
        需要 `strategy.manage`。`strategy_id` 显式给 `null` 表示清除设备层分配，
        回落到设备组层。设备层优先级最高（设计 D1：设备 > 设备组 > 成员）。
        策略必须属于本组织，跨组织 id 与不存在的设备一律 404。写入与审计同事务。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyAssignmentRequest"
      responses:
        "200":
          description: 已分配
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/devices/{deviceId}:
    patch:
      operationId: updateDevice
      summary: 更新设备（停用/恢复、归属、备注）
      description: |
        按字段更新设备（`device.write`）。请求体至少包含一个字段，同一请求中的多个字段
        要么全部生效、要么全部不生效；每个实际发生变化的字段各写一条审计
        （`device.disable` / `device.enable`、`device.assign`、`device.note`），
        未变化的字段不写审计。

        `disabled`（v0.8.0）：停用设备后拒绝该设备的新客户端认领、compat 登录、心跳与
        系统信息上报，并在同一事务撤销该设备在本组织的活跃 compat 会话；票据兑换被拒绝
        （409）。恢复后设备重新可被认领与连接。设备历史（心跳、会话、审计）保留。重复
        设置同一状态为 200 no-op。

        `owner_user_id`：设置设备归属人，值必须是本组织的有效成员（执行成员，会籍未停用），
        否则 404；`null` 清空归属；`0` 或负数非法（400）。归属人始终能在客户端看到并连接
        自己的设备（设备停用或会籍停用时除外）。

        `note`：运维备注，最长 255 字符，`null` 或空串清空。

        设备不属于本组织或不存在返回 404。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdateRequest"
      responses:
        "200":
          description: 更新后的设备
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/sessions:
    get:
      operationId: listSessions
      summary: 会话记录列表
      description: |
        本组织的会话记录，按 `started_at` 倒序（同秒按 `id` 倒序，保证翻页稳定），
        分页返回。组织成员即可读取。

        `origin` 区分两类来源：`panel`（面板签发：网页客户端与地址簿下发的连接
        票据，策略强制且可事前阻断）与 `native`（原生客户端直连，由 hbbs/hbbr
        日志采集推断，只记录不阻断）。`denied` 状态的会话只出现在 `panel` 来源，
        表示签发阶段即被策略拒绝，用于留痕。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: origin
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionOrigin"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SessionStatus"
        - name: deviceId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: since
          in: query
          required: false
          description: 起始时间（含），按 `started_at` 过滤
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: 结束时间（含），按 `started_at` 过滤
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: 会话详情（含事件序列）
      description: |
        返回单个会话及其事件序列（`started`/`approved`/`denied`/`closed` 等，
        按时间正序）。事件序列是审计留痕：超过 200 条时只返回最早 200 条并置
        `truncated=true`。组织成员即可读取。
      tags:
        - sessions
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
