  /api/v1/orgs/{orgId}/log-events:
    get:
      operationId: listLogEvents
      summary: 查询采集日志事件
      description: |
        返回本组织采集的 hbbs/hbbr 日志事件，按发生时间倒序，limit 上限 200（v0.12.2）。
        需要 `audit.read`；可见范围由角色 `audit_scope` 决定：`global` 查全组织，
        `individual` 只返回自己拥有设备（`devices.owner_user_id`）的事件；无法关联设备
        （`device_id` 为 null）的事件对 `individual` 不可见。列表轮询不写审计。
      tags:
        - logs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum:
              - info
              - warn
              - error
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 日志事件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEventListResponse"
