openapi: 3.1.0
info:
  title: Rustdesk-Control-Panel API
  version: 0.3.0
  contact:
    name: Rustdesk-Control-Panel
    url: https://github.com/GogoYang0/Rustdesk-Control-Panel-API
  description: |
    Rustdesk-Control-Panel 控制平面 API。

    本文件是系列唯一契约事实源：WEB 与 APP 的客户端类型由此生成。
    破坏性变更需升主版本（见设计文档 C10）；0.x 阶段破坏性变更以 minor 承载。
    0.3.0 破坏性变更：Invitation.token 不再随响应返回（邀请令牌仅通过邮件投递，
    修复 #17 邮箱所有权缺口）。

    统一响应包：所有业务响应为 `{code, message, data}`。
    `code` 为机器可读错误码（见 ErrorCode），成功时为 `ok`。
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: system
    description: 运维与自检接口
  - name: auth
    description: 认证与令牌
  - name: orgs
    description: 组织与成员
  - name: devices
    description: 设备与心跳
  - name: addressbooks
    description: 地址簿（个人/共享）
  - name: logs
    description: 采集日志查询
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 存活探针
      description: 返回进程存活状态，不需要认证。
      tags:
        - system
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok

  /api/v1/auth/login:
    post:
      operationId: login
      summary: 邮箱密码登录
      description: 校验邮箱与密码，返回 access/refresh 令牌对。受 IP 与账号双轨限流（429）。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      summary: 轮换 refresh 令牌
      description: |
        校验 refresh 令牌并轮换：旧令牌立即撤销，返回新的令牌对。
        重放已撤销令牌会撤销该用户全部 refresh 令牌，需重新登录。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 轮换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/orgs:
    get:
      operationId: listOrgs
      summary: 列出当前用户所属组织
      description: 返回调用者已加入的全部组织，按组织 id 升序。
      tags:
        - orgs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 组织列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrg
      summary: 创建组织
      description: 创建组织并将调用者设为 owner。
      tags:
        - orgs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/members:
    get:
      operationId: listMembers
      summary: 列出组织成员
      description: 返回指定组织的成员及其组织内角色；调用者必须是该组织成员。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 成员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/invitations:
    post:
      operationId: createInvitation
      summary: 邀请成员加入组织
      description: 生成邀请令牌（服务端只存哈希），有效期 7 天。需要 member.manage 权限。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
      responses:
        "201":
          description: 邀请已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: 接受邀请
      description: 使用邀请令牌加入组织；令牌过期或已使用返回 409。
      tags:
        - orgs
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptRequest"
      responses:
        "200":
          description: 已加入组织
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/devices:
    post:
      operationId: createDevice
      summary: 注册设备
      description: 在当前组织下登记一台 RustDesk 设备。需要 device.write 权限。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCreateRequest"
      responses:
        "201":
          description: 设备已登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/address-books:
    get:
      operationId: listAddressBooks
      summary: 列出地址簿
      description: |
        返回调用者可见的地址簿：个人地址簿（owner 为调用者）与共享地址簿。
        需要 addressbook 权限。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 地址簿列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAddressBook
      summary: 创建地址簿
      description: |
        创建地址簿。personal 由调用者拥有；shared 需要组织管理权限。
        同名同 scope 重复创建返回 409。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBookCreateRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/address-books/{bookId}:
    get:
      operationId: getAddressBook
      summary: 地址簿详情（含 peers 与 tags）
      description: 返回单个地址簿及其 peers 与 tags；无权访问或不存在返回 404。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 地址簿详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateAddressBook
      summary: 更新地址簿名称
      description: personal 仅 owner 可改；shared 需要组织管理权限。scope 创建后不可变更。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBookUpdateRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAddressBook
      summary: 删除地址簿（级联删除 peers 与 tags）
      description: 删除地址簿及其全部 peers 与 tags；不可恢复。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/address-books/{bookId}/peers:
    put:
      operationId: replaceAddressBookPeers
      summary: 全量替换地址簿 peers
      description: |
        以请求体完整替换该地址簿的 peers 列表，revision 递增。
        并发更新以 revision 兜底（乐观锁语义，供客户端同步对比）。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBookPeersReplaceRequest"
      responses:
        "200":
          description: 已替换
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/address-books/{bookId}/tags:
    put:
      operationId: replaceAddressBookTags
      summary: 全量替换地址簿标签
      description: 以请求体完整替换该地址簿的标签列表，revision 递增。
      tags:
        - addressbooks
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBookTagsReplaceRequest"
      responses:
        "200":
          description: 已替换
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/log-events:
    get:
      operationId: listLogEvents
      summary: 查询采集日志事件
      description: 返回本组织采集的 hbbs/hbbr 日志事件，按发生时间倒序，limit 上限 200。
      tags:
        - logs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum:
              - info
              - warn
              - error
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 日志事件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEventListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: 邮箱验证
      description: 使用邮件中的验证令牌完成邮箱验证；令牌过期或已使用返回 409。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationRequest"
      responses:
        "200":
          description: 验证成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: 重发验证邮件
      description: |
        无论邮箱是否存在均返回 200（防枚举）；存在未验证账号时才真正发送。
        受限流保护。
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: 请求已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/orgs/{orgId}/devices/{deviceId}/heartbeat:
    post:
      operationId: deviceHeartbeat
      summary: 设备心跳
      description: 上报设备在线心跳，刷新 last_seen_at。需要 device.write 权限。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 心跳已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未认证或令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 状态冲突（重复、过期或已使用）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: 触发限流
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorCode:
      type: string
      description: |
        机器可读错误码：
        - ok：成功
        - invalid_request：参数校验失败
        - unauthorized：未认证或令牌无效
        - forbidden：权限不足
        - not_found：资源不存在
        - conflict：状态冲突（重复创建、邀请过期或已使用）
        - rate_limited：触发限流
        - internal：服务端错误
      enum:
        - ok
        - invalid_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
        - internal

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type:
            - object
            - "null"
          additionalProperties: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 16

    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
          description: access 令牌剩余有效秒数

    TokenResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/TokenPair"

    Org:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 128
        created_at:
          type: string
          format: date-time

    OrgCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128

    OrgResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Org"

    OrgListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Org"

    Member:
      type: object
      required:
        - id
        - user_id
        - email
        - role
        - created_at
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - admin
            - member
        created_at:
          type: string
          format: date-time

    MemberResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
