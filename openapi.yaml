          maximum: 900
          default: 300
          description: 票据有效期（秒），默认 300

    Ticket:
      type: object
      required:
        - id
        - organization_id
        - device_id
        - expires_at
        - created_at
        - control_permissions
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
        actor_user_id:
          type: integer
          format: int64
        approval_id:
          type:
            - integer
            - "null"
          format: int64
          description: 绑定的审批请求（审批放行时）
        policy_snapshot:
          type:
            - object
            - "null"
          additionalProperties: true
          description: 签发时生效的策略快照（审计与排障用）
        control_role_id:
          type:
            - integer
            - "null"
          format: int64
          description: |
            签发时生效的控制角色 id；null 表示签发时未解析到角色（或服务未接线）。
        control_permissions:
          type: integer
          format: int64
          description: |
            签发时生效的权限位图，bit 序号与 `ControlPermissionStates` 的声明顺序一致
            （keyboard=0 … usb=13），只有 `enable` 置位。0 表示「没有显式启用的权限」，
            不是「未计算」。

            **原生会话不执行该位图**：hbbs 在信令消息里注入 `control_permissions`，
            本面板不在信令链路（设计 D10），因此它只是票据快照，供网页客户端与审计使用。
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        used_at:
          type:
            - string
            - "null"
          format: date-time
          description: 首次被兑换的时间；一次性，非 null 即不可再用
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            撤销时间。没有独立的撤销端点：成员被移出组织、角色降级或组织停用时，
            由 offboarding 路径撤销其**未兑换**的票据（T8）。

