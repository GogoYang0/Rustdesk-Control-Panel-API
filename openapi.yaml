      summary: 设备心跳
      description: |
        上报设备在线心跳，刷新 last_seen_at。需要 device.write 权限。
        设备已停用时返回 409（停用设备的活跃提示不再可信，也不会刷新时间）。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
