                $ref: "#/components/schemas/ClientBuildProfileListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createClientBuildProfile
      summary: 创建客户端品牌配置
      description: |
        需要 `client_build.manage`（owner/admin，不可委派）。名称去首尾空白后
        1–64 字符，组织内不区分大小写唯一；应用名 1–32 字符，拒绝精确的
        `RustDesk`。组织最多保留 10 个 profile。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientBuildProfileCreateRequest"
      responses:
        "201":
          description: 已创建的品牌配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBuildProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: 客户端构建能力未配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orgs/{orgId}/client-build-profiles/{profileId}:
    get:
      operationId: getClientBuildProfile
      summary: 读取客户端品牌配置
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 品牌配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBuildProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateClientBuildProfile
      summary: 更新客户端品牌配置
      description: 只允许修改 `name` 与 `app_name`；Logo 走独立端点。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientBuildProfileUpdateRequest"
      responses:
        "200":
          description: 已更新的品牌配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBuildProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: 客户端构建能力未配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClientBuildProfile
      summary: 删除客户端品牌配置
      description: 存在非终态构建时返回 409；历史构建保留快照。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: 客户端构建能力未配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orgs/{orgId}/client-build-profiles/{profileId}/logo:
    put:
      operationId: putClientBuildProfileLogo
      summary: 上传客户端 Logo
      description: |
        需要 `client_build.manage`。PNG、正方形 256–1024、解码后 ≤1 MiB；
        服务端会解码并重新编码，剥离元数据。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientBuildLogoUploadRequest"
      responses:
        "200":
          description: 已更新的品牌配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBuildProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: 客户端构建能力未配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getClientBuildProfileLogo
      summary: 读取客户端 Logo
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: PNG Logo
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteClientBuildProfileLogo
      summary: 删除客户端 Logo
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: 客户端构建能力未配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orgs/{orgId}/client-builds:
    get:
      operationId: listClientBuilds
      summary: 列出客户端构建
      description: |
        分页返回本组织的构建，按 id 降序。任何成员可读。
        `status` 与 `profileId` 可过滤；`status` 必须是已知状态。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - dispatching
              - dispatched
              - running
              - ingesting
              - succeeded
              - failed
              - cancelled
        - name: profileId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 构建列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBuildListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createClientBuild
      summary: 发起客户端构建
      description: |
        需要 `client_build.manage`。服务器地址、公钥与 API server 由本组织已部署的
        `ServerGroup`、`provision.relayHost` 与 `clientbuild.publicBaseURL` 推导，
        不接受用户传入。创建后返回 202，由后台任务异步 dispatch 到 GitHub Actions。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientBuildCreateRequest"
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBuildResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: 客户端构建未启用或未配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orgs/{orgId}/client-builds/{buildId}:
    get:
      operationId: getClientBuild
      summary: 读取客户端构建
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: buildId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 构建详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBuildResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/client-builds/{buildId}/cancel:
    post:
      operationId: cancelClientBuild
      summary: 取消客户端构建
      description: |
        需要 `client_build.manage`。取消为尽力而为：已进入产物回收后返回 409；
        已发起的 GitHub run 会被请求取消，终态以回调轮询结果为准。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: buildId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "202":
          description: 已请求取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBuildResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: 客户端构建未配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orgs/{orgId}/client-builds/{buildId}/artifacts/{artifactId}:
    get:
      operationId: downloadClientBuildArtifact
      summary: 下载构建产物
      description: 需要 `client_build.manage`；下载动作写审计。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: buildId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: artifactId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 产物文件
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/client-builds/{buildId}/bundle:
    get:
      operationId: downloadClientBuildBundle
      summary: 下载构建 bundle（构建 runner 使用）
      description: |
        公开端点，只接受短期 HMAC token；token 绑定路径 buildId，过期、篡改或
        跨构建使用一律 401。成功请求写 `client_build.bundle.served` 审计。
      tags:
        - orgs
      security: []
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: token
          in: query
          required: false
          description: 必填；缺失时由 handler 返回 401（生成器会先拒绝空的必填 query）
          schema:
            type: string
      responses:
        "200":
          description: bundle.tar.gz
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未认证或令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 状态冲突（重复、过期或已使用）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: 触发限流
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Internal:
      description: 服务端错误（如邀请邮件投递失败）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Identity:
      type: object
      required:
        - id
        - provider
        - issuer
        - subject
        - email
        - linked_at
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
        issuer:
          type: string
        subject:
          type: string
          description: IdP 侧的主体标识，仅对账户本人可见
        email:
          type: string
          description: 绑定时的 IdP 邮箱（不是账户邮箱的权威来源）
        linked_at:
          type: string
          format: date-time
        last_login_at:
          type:
            - string
            - "null"
          format: date-time
        conflict_at:
          type:
            - string
            - "null"
          format: date-time
          description: 非空表示绑定已冲突，SSO 拒绝直到管理员 reset

    IdentityList:
      type: object
      required:
        - active_provider
        - identities
      properties:
        active_provider:
          type: string
          description: 当前部署启用的外部身份源（oidc / ldap / 空串）
        identities:
          type: array
          items:
            $ref: "#/components/schemas/Identity"

    IdentityListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/IdentityList"

    IdentityUnlinkRequest:
      type: object
      required:
        - identity_id
      properties:
        identity_id:
          type: integer
          format: int64
        stepup_token:
          type: string
          description: passkey step-up 令牌（与 password 二选一）
        password:
          type: string
          description: 当前密码（与 stepup_token 二选一）

    LDAPLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 255
          description: 目录用户名（usernameAttribute 的值）；按 RFC 4515 转义后进 filter
        password:
          type: string
          maxLength: 1024
          description: 目录密码；只进 bind 请求，不落日志
        captcha:
          $ref: "#/components/schemas/CaptchaProof"
    OIDCExchangeRequest:
      type: object
      required:
        - ticket
      properties:
        ticket:
          type: string
          description: 回调重定向里的一次性 ticket

    OIDCStartRequest:
      type: object
      properties:
        redirect_path:
          type: string
          maxLength: 256
          description: 登录成功后回到的站内路径；缺省 `/`

    OIDCStart:
      type: object
      required:
        - authorization_url
        - state
      properties:
        authorization_url:
          type: string
          description: 浏览器应跳转的 IdP 授权地址（含 state / nonce / PKCE challenge）
        state:
          type: string
          description: 一次性 state；仅供客户端关联，无需回传

    OIDCStartResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/OIDCStart"

    AuthProviderStatus:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        name:
          type: string

    AuthProviders:
      type: object
      required:
        - oidc
        - ldap
      properties:
        oidc:
          $ref: "#/components/schemas/AuthProviderStatus"
        ldap:
          $ref: "#/components/schemas/AuthProviderStatus"

    AuthProvidersResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/AuthProviders"

    Passkey:
      type: object
      required:
        - id
        - name
        - created_at
        - transports
        - backup_eligible
        - backup_state
        - aaguid
        - clone_warning
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 用户可见的凭据名（1-64 字符，缺省为 `Passkey`）
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
        transports:
          type: array
          description: 认证器自报的传输方式（usb/nfc/ble/internal/hybrid）
          items:
            type: string
        backup_eligible:
          type: boolean
          description: 该凭据是否可被备份/同步（同步型 passkey 为 true）
        backup_state:
          type: boolean
          description: 该凭据当前是否已被备份
        aaguid:
          type: string
          description: 认证器型号标识；空串表示认证器未提供
        clone_warning:
          type: boolean
          description: 曾检测到签名计数器回退（疑似克隆），需重新绑定

    PasskeyResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Passkey"

    PasskeyCeremony:
      type: object
      required:
        - ceremony_token
        - options
      properties:
        ceremony_token:
          type: string
          description: 一次性 ceremony 句柄；有效期由部署配置 `webauthn.ceremonyTTL` 决定（默认 5 分钟）
        options:
          type: object
          additionalProperties: true
          description: |
            W3C PublicKeyCredentialCreationOptions / RequestOptions 的 JSON 形态，
            顶层键为 `publicKey`。字段名与标准一致，服务端只填充不重写；但**二进制
            字段是 base64url 字符串**（`challenge`、`user.id`、`excludeCredentials[].id`，
            登录时为 `allowCredentials[].id`）。

            ⚠️ **不能直接把这些对象交给浏览器**：`navigator.credentials.create()` /
            `get()` 要求上述字段是 `ArrayBuffer` / `TypedArray`。客户端必须先解码
            base64url（去掉 `-`/`_` 还原为 `+`/`/` 并补 `=`），再调用 WebAuthn API；
            返回值方向相反——`response.clientDataJSON`、`attestationObject`、
            `authenticatorData`、`signature`、`userHandle` 都是 `ArrayBuffer`，需再编码
            回 base64url 才能提交。参考实现见仓库 `docs/reference/passkey-smoke.html`
            的 `b64urlToBuf`，以及注册向的 `prepareCreationOptions`、登录向的
            `prepareRequestOptions`。

    PasskeyCeremonyResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/PasskeyCeremony"

    StepupToken:
      type: object
      required:
        - stepup_token
        - expires_in
      properties:
        stepup_token:
          type: string
        expires_in:
          type: integer
          format: int64
          description: 有效期（秒），固定 120

    StepupTokenResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/StepupToken"

    PasswordRemoveRequest:
      type: object
      required:
        - password
        - stepup_token
      properties:
        password:
          type: string
        stepup_token:
          type: string

    PasswordRemoveResult:
      type: object
      required:
        - warnings
      properties:
        warnings:
          type: array
          description: |
            连带影响说明：`compat_login_disabled` 表示原生客户端将无法再用该账户登录；
            `keep_a_second_passkey` 表示恢复只能依赖另一个 passkey。
          items:
            type: string

    PasswordRemoveResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/PasswordRemoveResult"

    PasswordSetRequest:
      type: object
      required:
        - new_password
        - stepup_token
      properties:
        new_password:
          type: string
        stepup_token:
          type: string

    PasskeyList:
      type: object
      required:
        - items
        - has_password
        - totp_enabled
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
        has_password:
          type: boolean
          description: 账户是否还有本地密码（false 表示 passkey-only）
        totp_enabled:
          type: boolean
          description: 账户是否启用了 TOTP

    PasskeyListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/PasskeyList"

    PasskeyNameRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 64

    PasskeyLoginBeginRequest:
      type: object
      properties:
        challenge_token:
          type: string
          description: 密码登录返回的短期挑战令牌（第二步用 passkey 代替 TOTP）
        email:
          type: string
          description: 可选邮箱提示，只用于收窄 allowCredentials，不构成账户存在性判断

    PasskeyLoginRequest:
      type: object
      required:
        - ceremony_token
        - credential
      properties:
        ceremony_token:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: |
            浏览器 `PublicKeyCredential` 的 JSON 形态
            （id/rawId/type/response.clientDataJSON/authenticatorData/signature/userHandle）。

            二进制字段（`rawId`、`clientDataJSON`、`authenticatorData`、`signature`、
            `userHandle`）必须是 **base64url 字符串**；`userHandle` 可为 `null`，
            `transports` 可缺失。服务端缺失兼容见 `docs/api-spec.md` §3.16。

    PasskeyRegistrationRequest:
      type: object
      required:
        - ceremony_token
        - credential
      properties:
        ceremony_token:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: |
            浏览器 `PublicKeyCredential` 的 JSON 形态
            （id/rawId/type/response.clientDataJSON/response.attestationObject）。

            `rawId`、`clientDataJSON`、`attestationObject` 必须是 **base64url 字符串**
            （不能是数组或 base64 标准编码）；`transports` 可缺失。
        name:
          type: string
          maxLength: 64
          description: 可选的凭据名；空或缺失时使用 `Passkey`

    ErrorCode:
      type: string
      description: |
        机器可读错误码：
        - ok：成功
        - invalid_request：参数校验失败
        - unauthorized：未认证或令牌无效
        - forbidden：权限不足
        - not_found：资源不存在
        - conflict：状态冲突（重复创建、邀请过期或已使用、验证令牌无效）
        - rate_limited：触发限流
        - internal：服务端错误
        - email_not_verified：邮箱未验证（登录被拒）
        - captcha_required：已启用验证码但请求未携带（400）
        - captcha_invalid：验证码挑战缺失、过期、已使用或答案错误（400）
        - captcha_unavailable：验证码提供商不可达且配置为 fail closed（503）
        - approval_required：票据签发被策略的事前审批要求阻断（409，`data.approval_id` 为待审批请求）
      enum:
        - ok
        - invalid_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
        - internal
        - email_not_verified
        - approval_required
        - two_factor_required
        - captcha_required
        - captcha_invalid
        - captcha_unavailable

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type:
            - object
            - "null"
          additionalProperties: true
          description: |
            错误上下文；多数错误为 null。`code=approval_required` 时带
            `approval_id`（int64，待审批请求 id），客户端据此跳转审批中心。
            `code=two_factor_required` 时带 `challenge_token`（短期挑战令牌）与
            `methods`（字符串数组：`totp`，以及该账户已绑定 passkey 时的
            `passkey`）。客户端用 `challenge_token` 调用 `POST /auth/2fa/verify`
            或 `POST /auth/passkey/login/begin` 完成第二步。

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128
        captcha:
          $ref: "#/components/schemas/CaptchaProof"

    CaptchaProof:
      type: object
      required:
        - response
      properties:
        response:
          type: object
          description: |
            提供商相关的验证凭据。`altcha` 传 `payload`（widget 返回的 base64
            payload）；`geetest` 传 `lot_number`、`captcha_output`、`pass_token`、
            `gen_time`；`cap` 传 `response`。
          additionalProperties:
            type: string

    CaptchaChallengePayload:
      type: object
      required:
        - params
      properties:
        params:
          type: object
          additionalProperties: true
          description: |
            提供商公开参数：`altcha` 为挑战 JSON（algorithm/challenge/maxnumber/
            salt/signature）；`geetest` 为 `captcha_id`/`script_url`；`cap` 为
            `api_endpoint`/`site_key`。

    CaptchaChallenge:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        provider:
          type: string
        challenge:
          $ref: "#/components/schemas/CaptchaChallengePayload"

    CaptchaChallengeResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/CaptchaChallenge"

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 16

    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
          description: access 令牌剩余有效秒数

    TokenResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/TokenPair"

    APIToken:
      type: object
      required:
        - id
        - organization_id
        - name
        - token_prefix
        - permissions
        - expires_at
        - created_at
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        name:
          type: string
        token_prefix:
          type: string
          description: 令牌前 8 个字符，用于列表辨识（不足以重放）
        permissions:
          type: array
          items:
            type: string
          description: 申请时的权限子集；有效权限还要与该用户当前角色取交集
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time

    IssuedAPIToken:
      type: object
      required:
        - token
        - plaintext
      properties:
        token:
          $ref: "#/components/schemas/APIToken"
        plaintext:
          type: string
          description: 明文令牌，只在本响应出现一次，服务端不保存

    APITokenListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"

    IssuedAPITokenResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/IssuedAPIToken"

    TokenCreateRequest:
      type: object
      required:
        - name
        - organization_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: 用户可读标签
        organization_id:
          type: integer
          format: int64
          description: 令牌绑定的组织；请求必须来自该组织的有效会籍
        permissions:
          type: array
          items:
            type: string
          description: 省略时取当前角色的全部权限；给出时必须是当前角色权限的子集
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90

    TOTPSetup:
      type: object
      required:
        - secret
        - otpauth_uri
      properties:
        secret:
          type: string
          description: Base32 编码的 TOTP 秘密（尚未启用）
        otpauth_uri:
          type: string
          description: 供验证器 App 扫码/导入的 `otpauth://totp/...` URI

    TOTPSetupResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/TOTPSetup"

    TOTPCodeRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 10
          description: 6 位 TOTP 码或恢复码

    TOTPDisableRequest:
      type: object
      required:
        - password
        - code
      properties:
        password:
          type: string
        code:
          type: string
          description: TOTP 码或一次性恢复码

    TOTPRecoveryCodes:
      type: object
      required:
        - codes
      properties:
        codes:
          type: array
          items:
            type: string
          description: 10 个一次性恢复码，只在本响应出现一次

    TOTPRecoveryCodesResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/TOTPRecoveryCodes"

    TOTPVerifyRequest:
      type: object
      required:
        - challenge_token
        - code
      properties:
        challenge_token:
          type: string
        code:
          type: string
          description: TOTP 码或一次性恢复码
        captcha:
          $ref: "#/components/schemas/CaptchaProof"

    MeResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Me"
    Me:
      type: object
      required:
        - user
        - orgs
      properties:
        user:
          $ref: "#/components/schemas/MeUser"
        orgs:
          type: array
          description: 按组织 id 升序；无有效会籍时为空数组
          items:
            $ref: "#/components/schemas/MeOrg"
    MeUser:
      type: object
      required:
        - id
        - email
        - email_verified
        - totp_enabled
        - has_password
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        totp_enabled:
          type: boolean
        has_password:
          type: boolean
          description: passkey-only 账户为 false（密码哈希为空哨兵）
    MeOrg:
      type: object
      required:
        - id
        - name
        - role_id
        - role_kind
        - permissions
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role_id:
          type: integer
          format: int64
        role_kind:
          type: string
          enum:
            - owner
            - admin
            - member
            - custom
        permissions:
          type: array
          description: 该角色的权限码集合（只读快照，不构成授权）
          items:
            type: string
    Org:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 128
        created_at:
          type: string
          format: date-time

    OrgCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128

    OrgResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Org"

    OrgListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Org"

    Member:
      type: object
      required:
        - id
        - user_id
        - email
        - role
        - role_id
        - role_name
        - disabled
        - created_at
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          description: 兼容字段，等同于 `role_name`；自定义角色名不限于内置三种
        role_id:
          type: integer
          format: int64
          description: 会籍引用的角色 id（`memberships.role_id`）
        role_name:
          type: string
          description: 角色展示名（内置 owner/admin/member 或自定义名称）
        control_role_id:
          type:
            - integer
            - "null"
          format: int64
          description: |
            成员的控制角色 id（v0.10.0）；`null` 表示未分配、回退组织内置 `default`。
            角色名称由 `GET /control-roles` 的列表解析（避免成员列表逐行 JOIN）。
        strategy_id:
          type:
            - integer
            - "null"
          format: int64
          description: 成员默认策略 id（v0.10.0）；作用于其拥有且无设备/组层分配的设备
        disabled:
          type: boolean
          description: 会籍是否已停用；停用后不能登录或访问该组织
        created_at:
          type: string
          format: date-time

    MemberResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Member"

    MemberListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    MemberUpdateRequest:
      type: object
      minProperties: 1
      description: |
        按字段更新会籍，至少给出 `role_id` 或 `disabled` 之一。
        - `role_id`：授予本组织内的内置 admin/member 或自定义角色（不能授予 owner）；
          需要 `org.admin`（仅 owner）。
        - `disabled`：停用或恢复会籍；需要 `member.manage`。不能停用自己或末位 owner；
          停用会在同一事务内撤销该用户在本组织的活跃 compat 会话。
      properties:
        role_id:
          type: integer
          format: int64
          description: 目标角色 id；owner 角色不可通过本端点授予
        disabled:
          type: boolean
          description: true 停用，false 恢复

    MemberMutation:
      type: object
      required:
        - revoked_sessions
      properties:
        revoked_sessions:
          type: integer
          format: int64
          description: 本次撤销的活跃 compat 会话数

    MemberMutationResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/MemberMutation"

    Permission:
      type: object
      required:
        - code
        - description
        - delegable
      properties:
        code:
          type: string
          description: 权限码，如 `member.manage`
        description:
          type: string
        delegable:
          type: boolean
          description: 自定义角色是否可以包含该权限码；false 为 owner 专属

    PermissionListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    RoleAuditScope:
      type: string
      description: |
        审计可见范围：`global` 可查全组织审计；`individual` 只查自己作为操作者
        或目标（用户类目标）的条目。仅对持有 `audit.read` 的角色有意义。
      enum:
        - global
        - individual

    RoleKind:
      type: string
      description: |
        - owner/admin/member：内置角色，权限集固定，不可修改或删除
        - custom：组织自建角色，权限只能是目录中 `delegable=true` 的子集
      enum:
        - owner
        - admin
        - member
        - custom

    Role:
      type: object
      required:
        - id
        - name
        - kind
        - permissions
        - audit_scope
        - builtin
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          $ref: "#/components/schemas/RoleKind"
        permissions:
          type: array
          items:
            type: string
          description: 角色持有的权限码集合
        audit_scope:
          $ref: "#/components/schemas/RoleAuditScope"
        builtin:
          type: boolean
          description: true 表示内置角色（不可编辑/删除/授予 owner）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RoleCreateRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 自定义角色名；不能与内置角色或已有角色重名
        permissions:
          type: array
          items:
            type: string
          description: 权限码子集；必须全部来自权限目录且 `delegable=true`
        audit_scope:
          $ref: "#/components/schemas/RoleAuditScope"
          description: 省略时默认 `individual`

    RoleUpdateRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          type: array
          items:
            type: string
        audit_scope:
          $ref: "#/components/schemas/RoleAuditScope"

    RoleResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Role"

    RoleListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    ControlRoleKind:
      type: string
      description: |
        - default：每个组织唯一的内置角色，不可删除，未分配角色的成员回退到它
        - custom：管理员创建的角色
      enum:
        - default
        - custom

    ControlPermissionState:
      type: string
      description: |
        单项权限的三态（对齐 RustDesk Server Pro）：
        - use_client：不覆盖被控端本地设置
        - enable：显式启用（覆盖本地设置）
        - disable：显式禁用（覆盖本地设置）
      enum:
        - use_client
        - enable
        - disable

    ControlPermissionStates:
      type: object
      description: |
        14 个权限键到三态的映射，键与 RustDesk 客户端 `ControlPermissions.Permission`
        枚举一一对应（bit 序号即声明顺序）：`keyboard`、`remote_printer`、
        `clipboard`、`file`、`audio`、`camera`、`terminal`、`tunnel`、`restart`、
        `recording`、`block_input`、`remote_modify`、`privacy_mode`、`usb`。
        未知键或非法状态整单拒绝；缺失键按 `use_client` 补全。
      additionalProperties:
        $ref: "#/components/schemas/ControlPermissionState"

    ControlRole:
      type: object
      required:
        - id
        - name
        - kind
        - permissions
        - builtin
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 64
        kind:
          $ref: "#/components/schemas/ControlRoleKind"
        permissions:
          $ref: "#/components/schemas/ControlPermissionStates"
        builtin:
          type: boolean
          description: true 表示内置 `default` 角色（不可删除、不可改名）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ControlRoleCreateRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          $ref: "#/components/schemas/ControlPermissionStates"

    ControlRoleUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          $ref: "#/components/schemas/ControlPermissionStates"

    ControlRoleListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ControlRole"

    ControlRoleResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/ControlRole"

    ControlRoleAssignmentRequest:
      type: object
      required:
        - control_role_id
      properties:
        control_role_id:
          type:
            - integer
            - "null"
          format: int64
          description: 目标控制角色 id；`null` 表示回到组织内置 default 角色

    Strategy:
      type: object
      required:
        - id
        - name
        - config_options
        - version
        - enabled
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 64
        config_options:
          type: object
          additionalProperties:
            type: string
          description: |
            下发给客户端的选项键值。**只允许以下 20 个键**（大小写与空格敏感，
            必须逐字匹配）：

            `enable-audio`、`enable-clipboard`、`enable-file-transfer`、
            `enable-file-copy-paste`、`enable-camera`、`enable-terminal`、
            `enable-tunnel`、`enable-remote-restart`、`enable-record-session`、
            `enable-block-input`、`enable-privacy-mode`、`enable-remote-modify`、
            `enable-remote-printer`、`enable-check-update`、`disable-change-id`、
            `disable-settings`、`disable-installation`、`disable-unlock-pin`、
            `disable-tcp-listen`、`disable-ab`。

            值按客户端原样字符串下发：开关类用 `Y`/`N`；**空值**表示清除该键、
            回到客户端内置默认。客户端会把下发的键标记为「固定」，用户无法在
            本机改回。

            网络类键（`api-server`、`custom-rendezvous-server`、`relay-server`、
            `key`、`whitelist` 等）一律拒绝：它们能改设备指向的服务器或密钥，
            等于设备接管。
        version:
          type: integer
          format: int64
          description: 下发版本；作为心跳响应的 `modified_at` 交给客户端比对
        cleared_keys:
          type: array
          items:
            type: string
          description: |
            已从 `config_options` 移除、仍以空值随下发回传的键（v0.10.0）。
            客户端只写收到的键，删除键必须显式清除，否则旧值会一直保留。
        enabled:
          type: boolean
          description: false 表示停用（保留行与分配，但心跳不下发）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StrategyAssignmentRequest:
      type: object
      required:
        - strategy_id
      properties:
        strategy_id:
          type:
            - integer
            - "null"
          format: int64
          description: 目标策略 id；`null` 表示清除该层分配

    StrategyCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        config_options:
          type: object
          additionalProperties:
            type: string
          description: 省略或空对象表示「不下发任何选项」（占位策略）

    StrategyUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        config_options:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean

    StrategyListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Strategy"

    StrategyResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Strategy"

    DeviceDisconnectRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
          description: 断连原因；写入审计，供事后追溯

    DeviceDisconnect:
      type: object
      required:
        - id
        - device_id
        - reason
        - status
        - requested_at
        - expires_at
      properties:
        id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
        reason:
          type: string
          maxLength: 255
        status:
          type: string
          description: |
            - `pending`：已记录，等待客户端心跳消费
            - `fulfilled`：某次心跳带回了活跃连接，`disconnect` 已下发
            - `expired`：15 分钟内没有可断开的连接，请求作废
          enum:
            - pending
            - fulfilled
            - expired
        requested_at:
          type: string
          format: date-time
        fulfilled_at:
          type:
            - string
            - "null"
          format: date-time
        expires_at:
          type: string
          format: date-time
        conn_count:
          type: integer
          description: 消费该请求的那次心跳里客户端报告的连接数

    DeviceDisconnectResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/DeviceDisconnect"

    UserGroupKind:
      type: string
      description: |
        - everyone：每个组织唯一的保留组，成员隐式（全部组织成员），不可改名/删除，
          成员集合不可编辑
