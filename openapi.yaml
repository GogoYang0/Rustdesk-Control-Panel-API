      responses:
        "200":
          description: 设备组列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createDeviceGroup
      summary: 创建设备组
      description: |
        需要 `access.manage`。名称为去首尾空白后的 1–64 个字符；同组织内重名
        （不区分大小写）返回 409。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGroupCreateRequest"
      responses:
        "201":
          description: 已创建的设备组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/device-groups/{deviceGroupId}:
    patch:
      operationId: renameDeviceGroup
      summary: 重命名设备组
      description: 需要 `access.manage`；名称规则与创建相同。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGroupRenameRequest"
      responses:
        "200":
          description: 重命名后的设备组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteDeviceGroup
      summary: 删除设备组
      description: |
        需要 `access.manage`。同一事务内把组内设备置为未分组，并级联删除以该组为
        目标的访问规则（逐条记录 `access.rule.delete` 审计）；重建同名组不会恢复
        旧授权。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已删除，返回级联规则数与解除分组的设备数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupDeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/device-groups/{deviceGroupId}/strategy:
    put:
      operationId: assignDeviceGroupStrategy
      summary: 分配设备组的客户端策略
      description: |
        需要 `strategy.manage`。作用于组内所有**没有设备层分配**的设备。
        `null` 清除组层分配。写入与审计同事务。
      tags:
        - devices
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyAssignmentRequest"
      responses:
        "200":
          description: 已分配
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/device-groups/{deviceGroupId}/devices:
    put:
      operationId: replaceDeviceGroupDevices
      summary: 全量替换设备组成员
      description: |
        需要 `access.manage`。目标设备从原设备组移入本组（一设备一组，覆盖旧值）；
        本组中原有但不在请求内的设备被置为未分组。所有设备 id 必须属于本组织，
        任一越界或不存在都整单 400。提交与现状相同的集合不产生变更。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: deviceGroupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGroupDevicesRequest"
      responses:
        "200":
          description: 已替换，返回新增与移除数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupDevicesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/access-rules:
    get:
      operationId: listAccessRules
      summary: 列出访问规则
      description: |
        返回组织的 allow 规则（含源组名与设备组目标名；`all_devices` 无目标组名）。
        需要 `access.manage`。多规则按并集生效。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 访问规则列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRuleListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createAccessRule
      summary: 创建访问规则
      description: |
        需要 `access.manage`。只支持 allow：`target_kind=device_group` 时必须给出
        同组织的设备组 id；`target_kind=all_devices` 时不得给出目标组。源用户组必须
        属于本组织。相同四元组重复创建返回 409。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRuleCreateRequest"
      responses:
        "201":
          description: 已创建的规则
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRuleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs/{orgId}/access-rules/{ruleId}:
    delete:
      operationId: deleteAccessRule
      summary: 删除访问规则
      description: |
        需要 `access.manage`。默认规则 `everyone → all_devices` 也是普通可删除行：
        删除后成员只保留精确组规则带来的访问（即收紧）。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/orgs/{orgId}/audit-logs:
    get:
      operationId: listAuditLogs
      summary: 查询审计日志
      description: |
        按 `created_at desc, id desc` 分页返回组织审计记录（v0.8.0，`audit.read`）。
        过滤条件全部可选；`from` 含、`to` 不含（UTC 半开区间）。

        可见范围由角色 `audit_scope` 决定：`global` 可查全组织；`individual` 只返回
        自己是操作者（`actor_user_id`）或用户类目标（`target_type=user` 且
        `target_id` 为自己）的条目。列表轮询不产生新的审计记录。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: action
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: actorUserId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: targetType
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: targetId
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 含下界（UTC）
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 不含上界（UTC）
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 审计记录页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{orgId}/audit-logs/export:
    get:
      operationId: exportAuditLogs
      summary: 导出审计日志 CSV
      description: |
        按与查询相同的过滤条件导出 CSV（v0.8.0，`audit.read`），单次最多 1000 行，
        超出返回 400 并提示收窄过滤。可见范围与查询一致。CSV 列：
        `created_at, actor_user_id, actor_email, action, target_type, target_id, detail`；
        以 `= + - @` 开头的单元格会加 `'` 前缀防止公式注入。导出动作写审计
        `audit.export`（含过滤条件与行数）。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: action
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: actorUserId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: targetType
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: targetId
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: CSV 文件
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{orgId}/connection-logs:
    get:
      operationId: listConnectionLogs
      summary: 查询客户端连接日志
      description: |
        按 `started_at desc, id desc` 分页返回客户端上报的连接记录（`audit.read`）。
