    SessionOrigin:
      type: string
      description: |
        会话来源：
        - panel：面板签发（网页客户端 / 地址簿下发的连接票据），策略强制、可事前阻断
        - native：RustDesk 原生客户端直连，由 hbbs/hbbr 日志采集推断，只记录不阻断
      enum:
        - panel
        - native

    SessionStatus:
      type: string
      description: |
        - open：进行中
        - closed：已结束
        - denied：签发阶段被策略拒绝（仅 panel 来源，用于留痕）
      enum:
        - open
        - closed
        - denied

    Session:
      type: object
      description: |
        会话生命周期（契约语义；实现见 M3 T4/T5/T7）：

        - **panel**：票据被兑换（`POST .../tickets/{ticketId}/redeem`）时创建，
          `started_at` 为兑换时刻。票据未兑换不产生会话、不占并发额度。
        - **native**：由 hbbs/hbbr 日志事件按 `device` 关联推断。归并前**先查同设备
          30 秒窗口内未关闭的会话**（含 panel）：
          命中 panel → 只刷新该会话的 `last_activity_at`，不新建 native 会话、不发
          native 相关告警（面板远控也要走本组织的 hbbs/hbbr，日志里同样有它）；
          命中 native → 事件归并到该会话；两者都没有 → 新建 native 会话。
          关联不到组织设备的事件不建会话（`device_id` 必填，不做无主会话）。
        - **活动时钟**：`status=open` 的会话 `last_activity_at` 非空；为 null 时以
          `started_at` 作为空闲判定基线。日志事件命中会话即刷新。
        - **结束**：可识别的连接结束事件（采集规则映射为 `SessionEvent.kind=disconnected`，
          规则随 T7 落地），或空闲超时（`last_activity_at` 之后默认 10 分钟、可由部署
          配置覆盖）把状态置 `closed`；`end_reason` 见 `SessionEndReason`。
          **已关闭的会话不会被重新打开**：窗口内再来的事件新建会话（重连 = 新会话）。
        - **时长上限是后置处理**：`max_session_minutes` 超限时由后台任务把会话置
          `closed`（`end_reason=policy_exceeded`）并产生告警；面板不在信令链路上，
          **不会掐断真实连接**——时长策略是记账与告警语义，不是强制断连。
        - **denied**：仅 panel 来源，由 `POST .../tickets`（签发阶段被策略拒绝）写入
          留痕行：`ticket_id=null`、`started_at`=`ended_at`=拒绝时刻、
          `end_reason=policy_denied`，不占并发额度。它不经兑换创建。
        - **并发口径**：`max_concurrent_sessions` 只统计 `status=open` 且
          `origin=panel` 的会话——native 只告警不阻断，计入会让策略不可执行。

        面板不在信令链路上（设计 D10）：M3 的票据是面板侧记账凭据，不注入信令。
      required:
        - id
        - organization_id
        - device_id
        - origin
        - status
        - started_at
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
          description: 组织内设备行 id
        rustdesk_id:
          type: string
          description: 设备对外 ID（RustDesk id），便于展示
        actor_user_id:
          type:
            - integer
            - "null"
          format: int64
          description: 发起人；native 直连无法识别发起人时为 null
        origin:
          $ref: "#/components/schemas/SessionOrigin"
        status:
          $ref: "#/components/schemas/SessionStatus"
        ticket_id:
          type:
            - integer
            - "null"
          format: int64
          description: 签发该会话的票据；native 会话为 null
        policy_id:
          type:
            - integer
            - "null"
          format: int64
          description: |
            本次生效的策略中 `id` 最小者（多条策略各管不同维度时无法唯一归因，
            因此固定取最小 id；具体约束以全部 enabled 策略的交集为准），
            组织没有启用中的策略时为 null
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
            - string
            - "null"
          format: date-time
        last_activity_at:
          type:
            - string
            - "null"
          format: date-time
          description: 最近一次关联事件时间（native 会话由日志事件驱动）
        end_reason:
          type:
            - string
            - "null"
          maxLength: 64
          description: |
            结束原因（进行中的会话为 null）：
            - `disconnected`：日志中识别到连接结束事件
            - `idle_timeout`：空闲超时（默认 10 分钟无关联事件）
            - `policy_exceeded`：超过 `max_session_minutes`（后置关闭，不断连）
            - `policy_denied`：签发阶段被策略拒绝（仅 `denied` 会话）
        revision:
          type: integer
          format: int64
          description: 会话记录修订号，每次状态变更递增

    SessionEvent:
      type: object
      required:
        - id
        - kind
        - at
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          maxLength: 64
          description: 事件类型（`started`/`approved`/`denied`/`ticket_issued`/`closed` 等，自由字符串）
        at:
          type: string
          format: date-time
        detail:
          type:
            - object
            - "null"
          additionalProperties: true

    SessionDetail:
      type: object
      required:
        - session
        - events
        - truncated
      properties:
        session:
          $ref: "#/components/schemas/Session"
        events:
          type: array
          description: |
            事件序列（按时间正序，取**最早** 200 条）。保留开头而非结尾：
            `started` / `ticket_issued` 这些审计上最关键的条目不能因为会话很长而丢失。
          items:
            $ref: "#/components/schemas/SessionEvent"
        truncated:
          type: boolean
          description: 事件超过 200 条时为 true（此时只返回最早的 200 条）

    SessionDetailResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/SessionDetail"

    SessionListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/SessionPage"

    PolicyRequest:
      type: object
      description: |
        策略请求体。`PUT` 是**全量替换**：`enabled` 与 `require_approval` 必填且必须
        显式给出布尔值（缺失或 null → 400），避免"省略即按默认值"的静默绕过——
        静默按 false 会把已启用的策略关掉或把审批要求取消。限额字段为 null（或省略）
        表示不限。
      required:
        - name
        - enabled
        - require_approval
      dependentRequired:
        allowed_start_minute:
          - allowed_end_minute
        allowed_end_minute:
          - allowed_start_minute
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type:
            - boolean
            - "null"
        max_concurrent_sessions:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
          description: 同一组织并发会话上限（只统计 open+panel 会话）；null 表示不限
        max_session_minutes:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
          description: 单会话时长上限（分钟）；null 表示不限
        allowed_start_minute:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          maximum: 1439
          description: |
            允许时段起点（UTC 当日分钟数，0 = 00:00）；与 `allowed_end_minute` 同为
            null 表示全天允许。起点大于终点表示跨零点窗口（如 1320–360 即
            22:00–06:00）
        allowed_end_minute:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
          maximum: 1439
          description: |
            允许时段终点（UTC 当日分钟数，不含）。必须与起点同时提供或同时为 null；
            两者相等（`start == end`）不是合法窗口——全天请用 null——返回 400。
        require_approval:
          type:
            - boolean
            - "null"
          description: |
            为 true 时，票据签发需先有已批准的审批请求。**必须显式给出 true/false**：
            缺失或 null 返回 400（bool 零值无法区分「没给」与「给了 false」，
            静默按 false 处理会把审批要求关掉）

    Policy:
      type: object
      required:
        - id
        - organization_id
        - name
        - enabled
        - require_approval
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        name:
          type: string
        enabled:
          type: boolean
        max_concurrent_sessions:
          type:
            - integer
            - "null"
          format: int64
          description: null 表示不限
        max_session_minutes:
          type:
            - integer
            - "null"
          format: int64
          description: null 表示不限
        allowed_start_minute:
          type:
            - integer
            - "null"
          format: int64
        allowed_end_minute:
          type:
            - integer
            - "null"
          format: int64
        require_approval:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PolicyResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Policy"

    PolicyListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Policy"

    ApprovalKind:
      type: string
      description: |
        - pre_approval：事前审批——为**将要发起**的连接放行一次票据签发
        - ratification：事后追认——对**已发生**的原生直连违规会话（日志推断）做确认，
          不产生票据
      enum:
        - pre_approval
        - ratification

    ApprovalStatus:
      type: string
      description: |
        - pending：待审批
        - approved：已批准。`kind=pre_approval` 时可被**一次**票据签发消费；
          `kind=ratification` 时表示「已追认」，不可消费、不产生票据
        - denied：已拒绝
        - expired：超期未决策（后台任务标记）
      enum:
        - pending
        - approved
        - denied
        - expired

    Approval:
      type: object
      required:
        - id
        - organization_id
        - device_id
        - kind
        - status
        - requested_at
        - expires_at
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/ApprovalKind"
        session_id:
          type:
            - integer
            - "null"
          format: int64
          description: 事后追认关联的会话（`kind=ratification`）；事前审批为 null
        actor_user_id:
          type: integer
          format: int64
          description: 发起审批的成员
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 待审批请求的有效期；超期由后台任务置为 expired
        decided_by:
          type:
            - integer
            - "null"
          format: int64
          description: 决策人（owner/admin）
        decided_at:
          type:
            - string
            - "null"
          format: date-time
        reason:
          type:
            - string
            - "null"
          maxLength: 500
          description: 申请理由或拒绝理由
        ticket_id:
          type:
            - integer
            - "null"
          format: int64
          description: 批准后被消费签发的票据（一次性绑定）

    ApprovalResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Approval"

    ApprovalListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/ApprovalPage"

    ApprovalCreateRequest:
      type: object
      description: |
        提交审批请求，按 `kind` 二选一：

        - `pre_approval`：必须提供 `device_id`
        - `ratification`（事后追认）：必须提供 `session_id`，且该会话必须属于本组织、
          `origin=native`（面板会话本身已受策略管控，无需追认）；`device_id` 由服务端
          从会话派生

        两者都给、都不给，或 `kind` 与字段不匹配，返回 `400 invalid_request`。
        同一 actor + 设备已有 `pending` 的事前审批时**复用**该请求（返回 200）；
        同一会话已有 `pending`/`approved` 的追认时同样复用，不重复创建。
      required:
        - kind
      properties:
        kind:
          $ref: "#/components/schemas/ApprovalKind"
        device_id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        reason:
          type: string
          maxLength: 500

    ApprovalDecision:
      type: string
      description: |
        - approve：批准（pre_approval 放行一次签发；ratification 即「已追认」）
        - deny：拒绝
      enum:
        - approve
        - deny

    ApprovalDecisionRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          $ref: "#/components/schemas/ApprovalDecision"
        reason:
          type: string
          maxLength: 500

    TicketCreateRequest:
      type: object
      required:
        - device_id
      properties:
        device_id:
          type: integer
          format: int64
        ttl_seconds:
          type: integer
          format: int64
          minimum: 30
          maximum: 900
          default: 300
          description: 票据有效期（秒），默认 300

    Ticket:
      type: object
      required:
        - id
        - organization_id
        - device_id
        - expires_at
        - created_at
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
        actor_user_id:
          type: integer
          format: int64
        approval_id:
          type:
            - integer
            - "null"
          format: int64
          description: 绑定的审批请求（审批放行时）
        policy_snapshot:
          type:
            - object
            - "null"
          additionalProperties: true
          description: 签发时生效的策略快照（审计与排障用）
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        used_at:
          type:
            - string
            - "null"
          format: date-time
          description: 首次被兑换的时间；一次性，非 null 即不可再用
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            撤销时间。没有独立的撤销端点：成员被移出组织、角色降级或组织停用时，
            由 offboarding 路径撤销其**未兑换**的票据（T8）。

    IssuedTicket:
      type: object
      required:
        - ticket
        - token
      properties:
        ticket:
          $ref: "#/components/schemas/Ticket"
        token:
          type: string
          description: 明文票据令牌，**仅此响应返回一次**（服务端只存摘要）

    IssuedTicketResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/IssuedTicket"

    AlertSeverity:
      type: string
      description: 告警级别
      enum:
        - info
        - warning
        - critical

    Alert:
      type: object
      required:
        - id
        - organization_id
        - kind
        - severity
        - created_at
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        session_id:
          type:
            - integer
            - "null"
          format: int64
        device_id:
          type:
            - integer
            - "null"
          format: int64
        kind:
          type: string
          maxLength: 64
          description: |
            告警类型（自由字符串，已知取值）：
            - `concurrency_exceeded`：并发会话超限
            - `duration_exceeded`：会话时长超限
            - `outside_window`：时段外发起

            事前审批阻断**不算告警**（正常的受控流程，每次都告警会让告警列表变成
            噪音）；它体现在 `409 approval_required` 与审计里。原生直连无法事前审批
            （审批是签发的前提），所以 native 会话的告警只用 `duration_exceeded` /
            `outside_window` 表达实际违规。
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        detail:
          type:
            - object
            - "null"
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    AlertListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/AlertPage"

    SessionPage:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        page:
          type: integer
        page_size:
          type: integer
          format: int64
        total:
          type: integer
          format: int64

    ApprovalPage:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        page:
          type: integer
        page_size:
          type: integer
          format: int64
        total:
          type: integer
          format: int64

    AlertPage:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        page:
          type: integer
        page_size:
          type: integer
          format: int64
        total:
          type: integer
          format: int64

    TicketRedeemRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 16
          description: 签发响应里返回的明文票据令牌

    TicketResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Ticket"

    ApprovalRequiredResponse:
      type: object
      description: |
        `409 approval_required` 的响应体：与 `ErrorResponse` 同形，但 `data` 带强类型
        的 `approval_id`（客户端要拿它去审批中心）。
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          type: object
          required:
            - approval_id
          properties:
            approval_id:
              type: integer
              format: int64

    SessionResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Session"
