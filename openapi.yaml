        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/control-roles:
    get:
      operationId: listControlRoles
      summary: 列出控制角色
      description: |
        返回组织的内置 `default` 角色与全部自定义角色，``default`` 在前。
        调用者必须是该组织成员；读取不需要 `control_role.manage`。

        **控制角色只决定「连上后能做什么」，且当前不约束原生客户端会话**：
        `control_permissions` 由 hbbs 在信令消息里注入，本面板不在信令链路
        （设计 D10），因此角色只在票据上留下快照，供网页客户端与审计使用。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 控制角色列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlRoleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createControlRole
      summary: 创建控制角色
      description: |
        需要 `control_role.manage`（owner 全量、admin 由内置集合授予，不可委派）。
        权限键必须来自 14 个协议键；未知键或非法状态整单 400。名称在组织内唯一，
        重名返回 409。缺失的权限键按 `use_client` 补全。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlRoleCreateRequest"
      responses:
        "201":
          description: 已创建的控制角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlRoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/control-roles/{roleId}:
    patch:
      operationId: updateControlRole
      summary: 更新控制角色
      description: |
        需要 `control_role.manage`。按字段更新，至少给出 `name` 或 `permissions` 之一。
        内置 `default` 角色的**名称不可改**（改权限可以）：启动播种与「未分配即回退
        default」都绑定该行；改名返回 409。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlRoleUpdateRequest"
      responses:
        "200":
          description: 更新后的控制角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlRoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteControlRole
      summary: 删除控制角色
      description: |
        需要 `control_role.manage`。内置 `default` 角色不可删（409）。删除在同一事务内
        把持有该角色的会籍改回「未分配」（回退 default），并写审计。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/members/{userId}/control-role:
    put:
      operationId: assignMemberControlRole
      summary: 分配成员的控制角色
      description: |
        需要 `control_role.manage`。`control_role_id` 显式给 `null` 表示回到组织内置
        `default` 角色。目标必须是本组织成员，角色必须属于本组织（跨组织 id 一律 404）。
        写入与审计同事务。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlRoleAssignmentRequest"
      responses:
        "200":
          description: 已分配
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{orgId}/strategies:
    get:
      operationId: listStrategies
      summary: 列出客户端策略
      description: |
        返回组织的策略，按名称升序。任何组织成员可读（控制台渲染分配需要列表）。

        **Strategy 是配置下发，不是授权**：它改被控端客户端选项（音频、剪贴板、
        文件传输等），与「能否连接」（访问控制）和「连上后能做什么」（控制角色）
        是三件不同的事。下发经客户端 30 秒一次的 `POST /api/heartbeat` 完成。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 策略列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createStrategy
      summary: 创建客户端策略
      description: |
        需要 `strategy.manage`（owner 全量、admin 由内置集合授予，不可委派）。
        名称去首尾空白后 1–64 字符，组织内**不区分大小写**唯一（CLI 按名解析，
        `Ops` 与 `ops` 并存会让解析歧义），重名返回 409。

        `config_options` 只接受白名单键（见 `Strategy.config_options` 说明）；
        未知键、超过 50 个键、值超过 256 字符或含控制字符均整单 400——客户端
        对收到的键**没有自己的白名单**，漏一个网络类键（如 `api-server`）就等于
        把设备交给别人。`version` 取自组织内单调的下发代次（首个策略为 1，此后递增，跨策略不重复）；`enabled=true`。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyCreateRequest"
      responses:
        "201":
          description: 已创建的策略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{orgId}/strategies/{strategyId}:
    get:
      operationId: getStrategy
      summary: 读取单个客户端策略
      description: |
        返回一个策略的完整定义（含 `version` 与 `cleared_keys`）。任何组织成员可读；
        跨组织 id 与不存在都返回 404。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: strategyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 策略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStrategy
      summary: 更新客户端策略
      description: |
        需要 `strategy.manage`。按字段更新（`name` / `config_options` /
        `enabled`），至少给出一项。

        `version` **只在 `config_options` 实际变化时 +1**：它是客户端判断「是否
        重新套用」的依据，改名或空转的 PATCH 不应触发一次全量下发。
        `enabled=false` 是停用开关——保留行与分配，但心跳不再下发；重新启用
        也不改写版本（客户端手上的选项没变）。
      tags:
        - orgs
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: strategyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
